rationale: >
  Pair 14 of the MASRL concept pair sheet (zone 3). Metacognitive Skills (MASRL) and Transfer and
  Adaptivity. What they share: MASRL calls the skills domain-free and domain-specific strategies tied
  to a subject, and suggests that building skills teaching into subject tasks might ease adoption (pp.
  21, 29). The article does not say how far either carries to new tasks. What keeps them apart: The
  Hanisch and Eirdosh paper argues for an underlying competency that supports many others, and Apt-AIR
  work reports strong task dependence. MASRL states the split without a test and does not say how much
  carries over. Sources: MASRL pp. 3, 21, 29; Hanisch and Eirdosh Sections 3, 4.1; Barzilai and Chinn
  2024 p. 14
