date: "2026-11-20"
status: proposed
rationale: >
  Pair 15 of the MASRL concept pair sheet (zone 3). Top-Down and Bottom-Up Regulation (MASRL) and
  Metacognitive Regulation. What they share: Top-down and bottom-up are two ways regulation can start,
  so the concept is a more specific account of regulation. What keeps them apart: The shared concept
  says nothing about whether regulation starts from a plan or from a signal. Apt-AIR and the design
  concept do not use this split. Sources: MASRL pp. 5, 14-15
