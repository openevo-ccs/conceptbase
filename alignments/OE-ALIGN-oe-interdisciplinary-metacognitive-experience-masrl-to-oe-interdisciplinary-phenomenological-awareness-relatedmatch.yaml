date: "2026-11-20"
status: proposed
rationale: >
  Pair 1 of the MASRL concept pair sheet (zone 1). Metacognitive Experience (MASRL) and
  Phenomenological Awareness. What they share: Both are what a person consciously notices of their own
  mental activity while it is going on. Pillow's five aspects (content, source, effort or difficulty,
  certainty or clarity, emotion) overlap with MASRL's familiarity, difficulty, effort, confidence and
  satisfaction. Pillow uses the words metacognitive experiences for the uncertainty cues. What keeps
  them apart: Pillow's awareness includes content, source and emotion, which MASRL does not count as
  ME (it excludes emotions explicitly, p. 4), and it serves as a source of knowledge for building
  concepts. MASRL's ME serve as input to control. The overlap is partial in both directions. Sources:
  MASRL pp. 3-4, 9; Pillow PDF pp. 13, 59-60, 99
