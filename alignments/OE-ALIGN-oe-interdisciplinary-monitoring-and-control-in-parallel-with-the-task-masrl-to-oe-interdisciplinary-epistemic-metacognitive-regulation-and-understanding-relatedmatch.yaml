status: proposed
rationale: >
  Pair 17 of the MASRL concept pair sheet (zone 3). Monitoring and Control in Parallel With the Task
  (MASRL) and Epistemic Metacognitive Regulation and Understanding. What they share: Apt-AIR also
  pairs epistemic monitoring and evaluation with control decisions to switch course or suspend a
  belief (2018, p. 369), and notes that these skills serve self, co-regulation and shared regulation.
  What keeps them apart: Apt-AIR's monitoring is of epistemic processes and products. MASRL's covers
  effort and affect as well and says control can feed back into monitoring (p. 6). Apt-AIR does not
  describe ME as the source of monitoring information in this aspect. Sources: MASRL pp. 6-7; Barzilai
  and Chinn 2018 p. 369
