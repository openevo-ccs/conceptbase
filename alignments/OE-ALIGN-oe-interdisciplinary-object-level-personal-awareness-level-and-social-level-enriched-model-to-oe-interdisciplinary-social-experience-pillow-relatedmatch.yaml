date: "2026-11-20"
status: proposed
rationale: >
  Pair 22 of the MASRL concept pair sheet (zone 5). Object Level, Personal Awareness Level and Social
  Level (Enriched Model) and Social Experience (Pillow). What they share: Both give other people a
  place. MASRL's Social level is built from reflection on personal awareness and supports
  co-regulation (p. 10). Pillow's social experience is one source of knowledge about cognition. What
  keeps them apart: The Social level is a level of functioning for regulating with others, where
  feelings are not shared and only perceived or judged. Pillow's concept is a source of information
  for a developing child. Sources: MASRL p. 10; Pillow PDF pp. 12, 17
