rationale: >
  Pair 5 of the MASRL concept pair sheet (zone 1). Metacognitive Experience (MASRL) and Epistemic
  Metacognitive Knowledge, Skills and Experiences. What they share: Both build on Flavell's split of
  metacognition into knowledge, skills or strategies, and experiences. The Multifaceted Framework
  defines epistemic metacognitive experiences as feelings and estimates evoked by building and
  justifying knowledge. What keeps them apart: The Apt-AIR concept is about knowledge and knowing
  only, and Barzilai and Chinn report epistemic emotions as counted among the experiences (2018, p.
  371). MASRL's ME are about cognition on any task and are set apart from emotion (p. 4). The concept
  55 also bundles knowledge and skills. Sources: MASRL pp. 4, 9; Barzilai and Chinn 2018 pp. 364, 370,
  371; Barzilai and Chinn 2024 p. 13
