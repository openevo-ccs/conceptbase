rationale: >
  Pair 6 of the concept decision sheet (zone 1). Pillow: Phenomenological Awareness. Hanisch and
  Eirdosh: Covert Behavior. What they share: Both are about what a person can notice in their own
  inner life. What keeps them apart: Pillow stresses that awareness is limited and indirect. The
  design concept treats thoughts and feelings as observable by the person and does not discuss
  accuracy.
