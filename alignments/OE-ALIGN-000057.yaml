rationale: >
  Pair 17 of the concept decision sheet (zone 4). Barzilai and Chinn: Adaptive Epistemic Performance.
  Hanisch and Eirdosh: Adaptive Flexibility. What they share: Both concern adjusting conduct to
  circumstances in service of an aim. The design concept takes its term from contextual behavioral
  science and does not borrow it from Apt-AIR. What keeps them apart: Apt-AIR's adaptivity fits
  epistemic processes to the task so that knowing succeeds. The design concept's flexibility fits
  behavior to chosen values and includes accepting discomfort. Treat the shared word as a prompt to
  compare the two.
