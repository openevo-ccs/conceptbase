rationale: >
  Pair 21 of the MASRL concept pair sheet (zone 5). Object Level, Personal Awareness Level and Social
  Level (Enriched Model) and Phenomenological Awareness. What they share: Both say cognitive
  processing is largely nonconscious and that conscious awareness gets only its products. The Enriched
  Model's Personal Awareness level is where subjective experiences become conscious, and Pillow's
  phenomenological awareness is conscious experience tied to cognitive processing. What keeps them
  apart: Pillow's awareness is a source of information for building concepts and its limits are
  stressed. The Personal Awareness level is the meta-level of Nelson and Narens, tied to monitoring
  and control. The article gives no mapping to MASRL's Person and Task X Person levels. Sources: MASRL
  pp. 5, 9-10; Pillow PDF pp. 13, 53-54
