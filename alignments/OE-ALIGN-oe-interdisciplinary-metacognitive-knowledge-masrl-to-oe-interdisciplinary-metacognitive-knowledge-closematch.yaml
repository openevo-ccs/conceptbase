date: "2026-11-20"
status: proposed
rationale: >
  Pair 8 of the MASRL concept pair sheet (zone 2). Metacognitive Knowledge (MASRL) and Metacognitive
  Knowledge. What they share: The shared concept already describes knowledge of persons, tasks and
  strategies in Flavell's line. MASRL's list of what metacognitive knowledge covers (cognitive
  processes, persons including the self, tasks, strategies and goals) includes the persons, tasks and
  strategies that the shared concept names in Flavell's line (p. 9). What keeps them apart: MASRL adds
  knowledge of goals, places the knowledge at the Person level and treats it as the step between a
  felt experience and the choice of what to do (pp. 5, 22). The shared concept leaves out those roles.
  The closeness holds for the first two sentences of the shared concept, which describe Flavell's
  line. The rest of that concept covers the other frameworks. Sources: MASRL pp. 5, 9, 22
