date: "2026-11-20"
status: proposed
rationale: >
  Pair 2 of the MASRL concept pair sheet (zone 1). Metacognitive Experience (MASRL) and Cognitive
  Monitoring (Pillow). What they share: Pillow's monitoring of effort or difficulty and certainty,
  within a list that also holds content, source and emotion, and MASRL's ME are two descriptions of
  similar signals. MASRL says ME, with metacognitive knowledge, are manifestations of the monitoring
  function (p. 9). It would approach close if only effort, difficulty and certainty were compared.
  What keeps them apart: Pillow's concept is the ongoing tracking of cues, with research reviewed by
  age, and it also lists content, source and emotion. MASRL's concept is the felt product of
  monitoring and an input to control. Sources: MASRL pp. 4, 9; Pillow PDF pp. 59-61, 100
