rationale: >
  Pair 33 of the concept decision sheet (zone 7). Pillow: Metacognitive Theories (Tacit, Informal,
  Formal). Barzilai and Chinn: Epistemic Metacognitive Knowledge, Skills and Experiences. What they
  share: Barzilai and Chinn say implicit conceptions about epistemic matters shape how learners read a
  task and have a metacognitive nature. What keeps them apart: Pillow gives a scale of levels from
  tacit to formal that Barzilai and Chinn do not use.
