date: "2026-11-20"
status: proposed
rationale: >
  Pair 20 of the MASRL concept pair sheet (zone 4). Affect System and Effort Regulation (MASRL) and
  Valuing and Effort. What they share: MASRL puts value and cost beliefs at the Person level (p. 5),
  puts effort inside the affect system, and cites task value shaping judgments of learning (p. 15).
  The shared concept says that valuing an aim shapes effort. What keeps them apart: MASRL says
  students may persist longer and exert more effort on difficult tasks that are important to them,
  such as exams, and that task value interacts with ME in setting the mode of regulation (p. 15). Its
  effort claims about the affect system concern boredom, felt difficulty and affect regulation (p. 5).
  The link is stated less directly than in Apt-AIR and the design concept. Sources: MASRL pp. 5, 7, 15
