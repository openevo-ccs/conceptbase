date: "2026-11-20"
status: proposed
rationale: >
  Pair 19 of the MASRL concept pair sheet (zone 4). Affect System and Effort Regulation (MASRL) and
  Adaptive Flexibility. What they share: Both are about what a person does with an unpleasant state
  while working toward something. In MASRL's example, an overarching goal to do one's best and
  reappraisal let a student keep working through negative affect (p. 7). In the paper, flexibility
  includes accepting uncomfortable experience while pursuing valued ends (Section 4.4.4). What keeps
  them apart: MASRL's affect regulation works to lower the unpleasant state so effort can go on, and
  its goal is not described as examined values. The paper's practice is acceptance together with
  values clarification. The paper speaks of motivating and persisting in behavior change (Section 3)
  and does not describe effort as something regulated inside an affect system. Sources: MASRL p. 7;
  Hanisch and Eirdosh Sections 4.1, 4.4.4
