rationale: >
  Pair 4 of the MASRL concept pair sheet (zone 1). Metacognitive Experience (MASRL) and Self-Knowledge
  About Thinking as Interpretation. What they share: Both say a felt experience has to be interpreted,
  and that the interpretation depends on what the person already knows. MASRL says feelings must be
  interpreted, which shapes the attribution and the strategies seen as suitable (p. 22). Pillow says
  the interpretation of metacognitive experiences is influenced by conceptual knowledge and by social
  experience (PDF p. 99). What keeps them apart: Pillow adds that awareness is limited and indirect
  and names social experience as a shaper. MASRL names attribution and metacognitive knowledge as
  shapers of the reading (p. 22), and separately reports that other people's confidence and a
  teacher's reactions influence a student's own confidence and satisfaction (pp. 7, 16, 24). This is
  the strongest overlap on interpretation. Sources: MASRL p. 22; Pillow PDF pp. 98-99
