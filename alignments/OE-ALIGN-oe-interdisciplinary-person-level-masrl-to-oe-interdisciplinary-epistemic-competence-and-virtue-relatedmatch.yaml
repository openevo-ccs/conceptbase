date: "2026-11-20"
status: proposed
rationale: >
  Pair 24 of the MASRL concept pair sheet (zone 5). Person Level (MASRL) and Epistemic Competence and
  Virtue. What they share: Both separate what a person brings from what happens in a task: MASRL's
  Person level from the Task X Person level (p. 5), and Sosa's competence, which Barzilai and Chinn
  adopt, from the apt performance that manifests it (2018, pp. 360-361). What keeps them apart:
  MASRL's Person level also holds motivation, attitudes and emotions toward learning, which Apt-AIR
  assigns to other aspects. Apt-AIR defines competence by reliability of success, and the shared
  concept calls these competencies developing and adaptive. The parallel is in structure only.
  Sources: MASRL p. 5; Barzilai and Chinn 2018 pp. 360-362
