rationale: >
  Pair 14 of the concept decision sheet (zone 3). Pillow: Social Experience (Pillow). Hanisch and
  Eirdosh: Mental Models of Human Behavior. What they share: A restatement of the in-press Hanisch and
  Eirdosh book says people pick up mental models from cultural surroundings such as parents, media and
