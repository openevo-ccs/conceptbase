date: "2026-11-18"
status: proposed
rationale: >
  Pair 23 of the concept decision sheet (zone 6). Hanisch and Eirdosh: Adaptive Flexibility. Barzilai
  and Chinn: Meta-Competence (Awareness of One's Own Competence). What they share: Each is the second
  named part of its framework's top-level target. What keeps them apart: Meta-competence guides
  first-order competence. Adaptive flexibility is the practice of persisting or changing behavior for
  values, and the paper does not say it directs conceptual understanding. Reading it as the regulating
  part is this comparison's interpretation.
