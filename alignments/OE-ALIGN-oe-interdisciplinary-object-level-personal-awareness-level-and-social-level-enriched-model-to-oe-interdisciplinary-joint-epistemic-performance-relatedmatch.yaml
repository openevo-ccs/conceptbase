date: "2026-11-20"
status: proposed
rationale: >
  Pair 23 of the MASRL concept pair sheet (zone 5). Object Level, Personal Awareness Level and Social
  Level (Enriched Model) and Joint Epistemic Performance. What they share: Both place individual work
  inside a social setting. MASRL's Social level makes co-regulation and shared regulation possible,
  and Apt-AIR's fifth aspect covers doing epistemic work with others (2018, p. 372), with its
  regulation skills described as usable for self, co-regulation and shared regulation (2018, p. 369).
  What keeps them apart: Apt-AIR's concern is joint development of norms and criteria and fairness of
  who is heard. MASRL's concern is how people perceive and judge each other's experiences. Sources:
  MASRL p. 10; Barzilai and Chinn 2018 pp. 369, 372
