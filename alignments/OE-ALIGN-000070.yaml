rationale: >
  Pair 35 of the concept decision sheet (zone 7). Barzilai and Chinn: Epistemic Thinking. Pillow:
  Epistemological Thought. What they share: Epistemological thought is an account of thinking about
  knowledge. What keeps them apart: Pillow describes it as one of three overlapping kinds of knowledge
  about cognitive activities, with a rough developmental order. Barzilai and Chinn describe epistemic
  thinking as the domain and set apt epistemic performance as the goal.
