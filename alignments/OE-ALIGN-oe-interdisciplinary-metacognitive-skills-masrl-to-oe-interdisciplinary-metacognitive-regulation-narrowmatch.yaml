matchType: skos:narrowMatch
assertedBy:
  - Dustin Eirdosh (decision, 2026-11-20); drafted by Claude (AI) for the OpenEvo Computational Curriculum Studies Working Group
date: "2026-11-20"
status: proposed
rationale: >
  Pair 12 of the MASRL concept pair sheet (zone 3). Metacognitive Skills (MASRL) and Metacognitive
  Regulation. What they share: Metacognitive skills in MASRL are a kind of deliberate regulation:
  orienting, planning, monitoring execution and evaluating. What keeps them apart: MASRL limits the
  term to domain-free skills and separates them from strategies tied to a subject. The shared concept
  covers regulation of any kind and of behavior as well. The article lists monitoring among the skills
  while assigning ME to monitoring and strategies to control (p. 9), so the fit is loose. Sources:
  MASRL pp. 9, 21
