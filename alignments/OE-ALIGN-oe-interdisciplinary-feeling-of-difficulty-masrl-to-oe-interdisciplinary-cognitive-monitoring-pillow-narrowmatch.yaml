matchType: skos:narrowMatch
assertedBy:
  - Dustin Eirdosh (decision, 2026-11-20); drafted by Claude (AI) for the OpenEvo Computational Curriculum Studies Working Group
date: "2026-11-20"
status: proposed
rationale: >
  Pair 3 of the MASRL concept pair sheet (zone 1). Feeling of Difficulty (MASRL) and Cognitive
  Monitoring (Pillow). What they share: The feeling of difficulty is one kind of cue within Pillow's
  monitoring, which lists feelings of effort or difficulty as one of its aspects. What keeps them
  apart: MASRL separates the feeling from judgments of learning and from the perception of task
  difficulty, and gives it a role in effort and attribution. Pillow gives effort and difficulty
  feelings the role of cues about whether an activity is deliberate or automatic. Only one aspect of
  Pillow's concept is covered. Sources: MASRL pp. 10-11; Pillow PDF pp. 59-60
