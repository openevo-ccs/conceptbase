rationale: >
  Pair 28 of the concept decision sheet (zone 7). Pillow: Knowledge About Cognitive Activities.
  Hanisch and Eirdosh: Metacognitive Competency About Human Behavior. What they share: Both concern
  understanding of mind and behavior. What keeps them apart: Pillow describes how children come to
  know cognitive activities. The design concept sets a target of understanding human behavior,
  including one's own thoughts and feelings, and acting in line with values.
