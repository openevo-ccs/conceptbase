rationale: >
  Pair 11 of the MASRL concept pair sheet (zone 2). Metacognitive Knowledge (MASRL) and Mental Models
  of Human Behavior. What they share: Both are stored ideas that shape how a person reads their own
  experience and what follows. MASRL has metacognitive knowledge between feeling and strategy (p. 22).
  The paper argues that mental models of behavior affect how people notice, interpret and react
  (Section 3). What keeps them apart: The object differs: ideas about cognition, tasks and strategies
  against ideas about why people act as they do. The paper's evidence concerns beliefs about behavior
  and wellbeing and was not examined here. Sources: MASRL p. 22; Hanisch and Eirdosh Section 3
