date: "2026-11-18"
status: proposed
rationale: >
  Pair 18 of the concept decision sheet (zone 5). Barzilai and Chinn: Epistemic Aim. Hanisch and
  Eirdosh: Values-Based Choice. What they share: In both, what a person values bears on what they do.
  What keeps them apart: Epistemic aims concern getting a representation of the world right.
  Values-based choice concerns actions and life values. Barzilai and Chinn propose a link from valuing
  aims to effort. The Hanisch and Eirdosh paper cites studies linking values reflection to school
  motivation.
