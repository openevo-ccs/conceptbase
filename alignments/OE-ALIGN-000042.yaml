rationale: >
  Pair 1 of the concept decision sheet (zone 1). Pillow: Cognitive Monitoring (Pillow). Barzilai and
  Chinn: Epistemic Metacognitive Regulation and Understanding. What they share: Both concern noticing
  one's own mental activity. What keeps them apart: Pillow treats monitoring as a source of cues
  children use to learn about cognitive activities. Apt-AIR treats monitoring, with planning,
  evaluating and controlling, as skills that guide epistemic work.
