rationale: >
  AI-drafted on 2026-10-26 and checked by a second AI. No subject-matter
  expert has reviewed it. The Interdisciplinary concept Technology and this
  AI4K12 row are related and neither contains the other. Technology here
  covers tools made and adopted in every domain. AI4K12 rows on AI in daily
  life and on AI's effects on sectors of society treat one family of tools and
  what follows from using it. They do not define technology. AI4K12 row 5-C-i
  is 'AI & the Economy (Impacts of AI on Sectors of Society)'. The alignment
  is a match of topic and sense, drawn for the Interdisciplinary space's
  richer cross-domain reading of the concept.
