date: "2026-11-20"
status: proposed
rationale: >
  Pair 16 of the MASRL concept pair sheet (zone 3). Monitoring and Control in Parallel With the Task
  (MASRL) and Metacognitive Monitoring. What they share: MASRL's monitoring follows the progress of
  thinking, as the shared concept describes, and the article says ME are its product (p. 9). What
  keeps them apart: MASRL adds that monitoring and control run in parallel with the task phases, can
  be implicit, and cover effort and affect. The shared concept describes monitoring alone. Sources:
  MASRL pp. 6-7, 9
