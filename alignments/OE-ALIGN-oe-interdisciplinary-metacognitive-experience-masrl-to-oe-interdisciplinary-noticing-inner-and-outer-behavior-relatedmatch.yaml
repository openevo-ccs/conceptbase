rationale: >
  Pair 6 of the MASRL concept pair sheet (zone 1). Metacognitive Experience (MASRL) and Noticing Inner
  and Outer Behavior. What they share: Both register a person's own inner state. The paper says the
  Noticing Tool lets learners analyze the causes and functions of their own subjective experience, and
  its examples include doubt and uncertainty, among others, which sit close to MASRL's confidence
  (Section 4.4.4). What keeps them apart: The Noticing Tool is a classroom practice that asks for
  interpretation of function and for acceptance, and its object is behavior including life behavior.
  MASRL's ME arise by themselves during a task and feed control of that task. The paper discusses no
  accuracy. Sources: MASRL pp. 4-5; Hanisch and Eirdosh Section 4.4.4
