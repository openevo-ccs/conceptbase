status: proposed
rationale: >
  Pair 18 of the MASRL concept pair sheet (zone 4). Affect System and Effort Regulation (MASRL) and
  Epistemic Caring and Enjoying. What they share: Both concern emotions during work on a knowledge
  task and treat them as bearing on effort and engagement. Apt-AIR's aspect 4 holds caring and
  epistemic emotions, and MASRL holds boredom lowering effort and reappraisal keeping a student going.
  What keeps them apart: Barzilai and Chinn report Barzilai and Zohar as counting epistemic emotions
  among metacognitive experiences (2018, p. 371), and Apt-AIR treats caring as a disposition. MASRL
  keeps affect as a separate system with its own regulation (p. 5). See the divergence record on
  whether affect is part of metacognition. Sources: MASRL pp. 5, 7; Barzilai and Chinn 2018 pp.
  370-372
