date: "2026-11-20"
status: proposed
rationale: >
  Pair 9 of the MASRL concept pair sheet (zone 2). Metacognitive Knowledge (MASRL) and Knowledge About
  Cognitive Activities. What they share: MASRL's metacognitive knowledge includes declarative
  knowledge of cognitive processes such as memory, which is the content of Pillow's knowledge about
  cognitive activities. What keeps them apart: MASRL adds knowledge of persons, tasks, strategies and
  goals. Pillow's concept includes epistemological thought, which MASRL's list does not mention. Each
  leaves out a part of the other, so neither is narrower. Sources: MASRL p. 9; Pillow PDF pp. 13, 23
