rationale: >
  Pair 26 of the concept decision sheet (zone 7). Pillow: Epistemological Thought. Barzilai and Chinn:
  Epistemic Metacognitive Knowledge, Skills and Experiences. What they share: Epistemological thought,
  general assumptions about the nature of knowledge, overlaps with knowledge about knowledge and
  knowing. What keeps them apart: Pillow's is a set of general assumptions about knowledge. The
  Multifaceted Framework's knowledge facet also covers knowledge about criteria and processes, which
  Barzilai and Chinn stress more.
