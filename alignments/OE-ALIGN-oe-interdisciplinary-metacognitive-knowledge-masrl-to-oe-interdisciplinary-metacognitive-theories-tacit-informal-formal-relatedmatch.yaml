date: "2026-11-20"
status: proposed
rationale: >
  Pair 10 of the MASRL concept pair sheet (zone 2). Metacognitive Knowledge (MASRL) and Metacognitive
  Theories (Tacit, Informal, Formal). What they share: Both describe ideas about one's own thinking
  that can be held without being tested against evidence (Pillow, PDF p. 44) or can be inaccurate
  (MASRL, p. 22), and that guide what a person does. Pillow's tacit theories guide behavior without
  awareness. MASRL cites inaccurate beliefs about strategies, such as the belief that massed practice
  works better (p. 22). What keeps them apart: Pillow, reporting Schraw and Moshman, grades such
  theories by how explicit they are (PDF pp. 44-45). MASRL grades them by how accurate they are and by
  their effect on strategy choice. No source links the two gradings. Sources: MASRL pp. 13-14, 22;
  Pillow PDF pp. 44-45
