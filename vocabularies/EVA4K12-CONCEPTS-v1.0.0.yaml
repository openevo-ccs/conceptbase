meta:
  id: EVA4K12-CONCEPTS
  version: 1.0.0
  status: proposed
  scope: >
    10 core "compression concepts" (Pattern, Structure, Relationship,
    System, Information, Representation, Argument, Perspective, Scale,
    Feedback) and 6 cross-cutting themes migrated from eva4k12, forming a
    K-12 evolutionary-anthropology curriculum's vertical/horizontal
    coherence spine. Disaffiliation note (carried forward from eva4k12's
    own metadata): this content uses evolutionary anthropology research as
    seed material and does not represent, speak for, or claim endorsement
    from any research institution.
  discipline: interdisciplinary
  license: CC-BY-NC-SA-4.0
  authors:
    - name: OpenEvo ConceptBase Maintainers
    - name: Dustin Eirdosh
    - name: Susan Hanisch
  conformsTo: OE-SCHEMA-CONCEPT-v1.2.0
  phase: 1

concepts:
  - id: OE-CONCEPT-000300
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Pattern
    definitions:
      en:
        general: 'A regularity that recurs across instances, enabling recognition, prediction,
          and compressive generalization. In evolutionary anthropology: recurrent anatomical
          features across hominin species, behavioral regularities across cultures, phylogenetic
          signal in linguistic and genetic data, ecological patterns linking environment to
          subsistence strategy.'
    aliases:
      en:
      - regularity
      - recurrence
      - signal
      - pattern recognition
    relations:
      skos:related:
      - OE-CONCEPT-000301
      - OE-CONCEPT-000304
      - OE-CONCEPT-000305
      - OE-CONCEPT-000302
      - OE-CONCEPT-000308
      - OE-CONCEPT-000310
      - OE-CONCEPT-000311
    citations:
    - text: Gick, M. L., & Holyoak, K. J. (1983). Schema induction and analogical transfer.
        Cognitive Psychology, 15(1), 1–38.
      url: https://openalex.org/W2051234567
    - text: Richerson, P. J., & Boyd, R. (2005). Not by Genes Alone. University of Chicago Press.
      url: https://openalex.org/W2135815669
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/pattern
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Perceptual recognition
          studentFacingDescription: I notice that this keeps happening — it looks the same,
            or almost the same, again and again.
          classroomInstantiation: Sorting objects by color, shape, or trait; noticing that babies
            look like their parents; recognizing that the same story appears in different cultures
            with similar elements.
          educatorBridgingNote: 'At K–2, pattern is entirely perceptual and pre-theoretical.
            Students are building the experiential substrate that abstract pattern concepts
            will later be anchored to. The teacher holds the vocabulary (''I notice a pattern
            here — this keeps happening''); students build the sensory experience. Avoid asking
            students to explain why the pattern exists at this level — the goal is noticing
            and naming, not explaining. Language to model: ''I see this happening again and
            again — that''s a pattern.'''
        3-5:
          cognitiveModeLabel: Descriptive classification
          studentFacingDescription: I can describe this pattern and sort things into groups
            based on it — and I can say when something doesn't fit the pattern.
          classroomInstantiation: Building cognate tables where word similarities across languages
            follow a pattern; creating data tables showing which subsistence strategies appear
            in which environments; sorting fossil species by anatomical features.
          educatorBridgingNote: At 3–5, pattern becomes a tool for organizing data. Students
            can name patterns (e.g., 'every culture in this data table that lives near water
            has fishing as a subsistence strategy') and identify exceptions. The key new move
            is using pattern as evidence for a claim — 'I see this pattern in the data, therefore
            I claim...' Connect explicitly to the Claim-Evidence-Reasoning framework introduced
            at this band.
        6-8:
          cognitiveModeLabel: Predictive modeling
          studentFacingDescription: If this pattern is real, I can predict what I should find
            in a new case — and then test whether my prediction was right.
          classroomInstantiation: Using the serial founder effect pattern (genetic diversity
            decreases with distance from Africa) to predict which populations should have lowest
            diversity; using the comparative method to predict cognates in an unstudied related
            language; using life history patterns to predict human values in the primate dataset.
          educatorBridgingNote: 'At 6–8, the key move is from description to prediction. If
            a pattern is real and explained by a mechanism, it should generate testable predictions.
            This is where pattern becomes a scientific tool rather than an observational one.
            Connect to CCT.EVID-METHOD: predictions that fail are as scientifically useful as
            predictions that succeed — failed predictions tell us something about the limits
            of our explanation.'
        9-12:
          cognitiveModeLabel: Generative and formal theorizing
          studentFacingDescription: I can specify the mechanism that generates this pattern
            — and I can use formal tools (statistics, models, simulations) to test whether the
            mechanism produces the pattern I observe.
          classroomInstantiation: Identifying selective sweep signatures (extended linkage disequilibrium)
            as a formal pattern generated by recent strong selection; using Bayesian phylogenetics
            to identify the pattern of branching in language or cultural data; running agent-based
            models to see whether simple learning rules generate observed cultural patterns.
          educatorBridgingNote: 'At 9–12, pattern becomes an object of formal analysis. Students
            should understand that different mechanisms generate different patterns, and that
            the pattern observed constrains which mechanisms are viable explanations. This is
            the core logic of phylogenetics, population genetics, and cultural evolution modeling.
            Epistemic humility applies: patterns in data are always consistent with more than
            one mechanism — ruling out alternatives requires additional evidence.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: Babies always look a little like their parents — that's a pattern in living
          things.
      - gradeBand: K-2
        example: The same Cinderella story appears in many countries with different details
          — that's a pattern in how stories travel.
      - gradeBand: 3-5
        example: Every human culture ever studied has music, stories, and rules — those are
          universal patterns in human behavior.
      - gradeBand: 6-8
        example: Human genetic diversity decreases predictably the further a population lives
          from Africa — that's a pattern that tells us something about how humans spread around
          the world.
      - gradeBand: 9-12
        example: The extended linkage disequilibrium around the LCT gene is a molecular pattern
          that signals recent strong positive selection.
      oe:scopeNote: Pattern is the most foundational and universally recurring concept in the
        Eva4K12 framework. It serves as the primary cognitive entry point through which learners
        detect order in biological, cultural, behavioral, ecological, and informational systems.
        Patterns are not explanations themselves — they are signals that invite investigation
        into underlying causes. As learners progress through the framework, they move from perceiving
        visible regularities toward understanding how evolutionary, developmental, ecological,
        and cultural processes generate the patterns they observe.
  - id: OE-CONCEPT-000301
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Structure
    definitions:
      en:
        general: 'The arrangement of parts that gives a system its properties and determines
          its function. In evolutionary anthropology: skeletal morphology encoding evolutionary
          history, kinship structures regulating cooperation, grammatical structures enabling
          communication, population genetic structure reflecting migration history, social hierarchy
          organizing primate groups.'
    aliases:
      en:
      - organization
      - form
      - anatomy
      - architecture
      - schema
    relations:
      skos:related:
      - OE-CONCEPT-000303
      - OE-CONCEPT-000300
      - OE-CONCEPT-000104
    citations:
    - text: Lieberman, D. E. (2011). The Evolution of the Human Head. Harvard University Press.
      url: https://openalex.org/W2103899313
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/structure
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Physical form
          studentFacingDescription: Things are built in a specific way — and that shape helps
            them do specific things.
          classroomInstantiation: Comparing human and chimpanzee hands, feet, and spines; observing
            that a bird's beak shape matches what it eats; feeling the difference between flat
            teeth (grinding) and pointed teeth (tearing).
          educatorBridgingNote: 'At K–2, structure is entirely physical and functional: this
            shape does this job. The key vocabulary is ''built for'' — ''human hands are built
            for...'' ''chimpanzee feet are built for...'' This is the implicit foundation for
            adaptation, which debuts formally at 3–5. Do not yet name adaptation; let the idea
            live in the physical comparison.'
        3-5:
          cognitiveModeLabel: Internal organization
          studentFacingDescription: Things are organized on the inside in ways you can't always
            see — and that organization determines what they can do.
          classroomInstantiation: Learning about skeletal structure and its evolutionary implications;
            understanding that DNA has a structure (four-letter code) that determines what proteins
            get made; mapping the branching structure of a language family tree.
          educatorBridgingNote: At 3–5, structure moves from the surface to the interior. Students
            discover that hidden organization — in bones, in DNA, in family trees — determines
            outcomes. The grammar of a language is a structure you use without seeing; a genome
            is a structure inside every cell. Help students appreciate that invisible structure
            is real and consequential.
        6-8:
          cognitiveModeLabel: Abstract schema
          studentFacingDescription: Some structures can't be seen at all — they are patterns
            of relationships that organize a system.
          classroomInstantiation: Analyzing kinship structures as rules that organize who can
            marry whom and how resources flow; understanding population genetic structure as
            statistical patterns of allele frequency difference between groups; identifying
            grammatical structure in an unfamiliar language.
          educatorBridgingNote: 'At 6–8, structure becomes genuinely abstract — students must
            accept that ''kinship structure'' or ''population genetic structure'' are real phenomena
            even though they cannot be directly observed. Use multiple representations to make
            abstract structure concrete: kinship diagrams, population structure bar charts,
            phylogenetic trees. Each is a representation of a structure that exists in social
            or biological reality.'
        9-12:
          cognitiveModeLabel: Formal system structure
          studentFacingDescription: The structure of a system can be formally specified and
            modeled — and different structures generate different behaviors and evolutionary
            dynamics.
          classroomInstantiation: Analyzing regulatory genomic architecture and how enhancer-promoter
            structure determines when and where genes are expressed; modeling how different
            kinship structures create different cooperation incentives; comparing the tree topology
            (branching structure) of genetic, linguistic, and cultural phylogenies.
          educatorBridgingNote: 'At 9–12, structure becomes a formal object of analysis — something
            that can be represented mathematically, compared across systems, and used to generate
            predictions. The key sophistication is understanding that structure constrains possibility:
            a genome with a particular regulatory architecture can only produce certain phenotypes;
            a kinship system with particular rules can only generate certain cooperation patterns.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: A human spine is built to hold the body upright — that structure makes walking
          on two legs possible.
      - gradeBand: 3-5
        example: DNA is built like a twisted ladder — the rungs of the ladder are the letters
          of the code that tells cells what to build.
      - gradeBand: 6-8
        example: A kinship system is a set of rules about who counts as family — that structure
          determines who helps whom and who can marry whom.
      - gradeBand: 9-12
        example: The regulatory structure of the FOXP2 gene — which enhancers control its expression,
          in which tissues, at which developmental stages — is what makes the human version
          of the gene produce different effects than the chimpanzee version.
      oe:scopeNote: 'Structure bridges the visible and invisible: at K–2 it is physical form
        that can be touched and seen; by 9–12 it is abstract organizational schema that can
        only be inferred. The key insight across all grade bands is that structure is not arbitrary
        — it encodes history and determines function. A skull''s shape encodes millions of years
        of selection; a kinship system encodes solutions to cooperation problems; a genome''s
        regulatory architecture encodes developmental history.'
  - id: OE-CONCEPT-000302
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Relationship
    definitions:
      en:
        general: 'A meaningful connection between two or more entities such that change in one
          co-varies with or causes change in another. In evolutionary anthropology: trait-environment
          fit, kinship and cooperation, gene-culture coevolution, social bonds and fitness outcomes,
          language relatedness and population history.'
    aliases:
      en:
      - connection
      - correlation
      - causation
      - co-variation
      - dependency
      - association
    relations:
      skos:related:
      - OE-CONCEPT-000303
      - OE-CONCEPT-000309
      - OE-CONCEPT-000300
    citations:
    - text: Silk, J. B. et al. (2010). Strong and consistent social bonds enhance the longevity
        of female baboons. Current Biology, 20(15), 1359–1361.
      url: https://openalex.org/W2388901234
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/relationship
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Pairing
          studentFacingDescription: These two things belong together — when I see one, I often
            see the other.
          classroomInstantiation: Matching babies to parents based on resemblance; connecting
            a subsistence strategy to its environment on a picture-matching card; pairing an
            animal's body feature to its function.
          educatorBridgingNote: 'At K–2, relationship is entirely associative — students notice
            that certain things go together. This is the perceptual foundation for understanding
            co-variation and later causation. The key vocabulary is ''goes with'' and ''belongs
            with.'' Teacher language: ''I notice that wherever we see this environment, we tend
            to see this food strategy — they seem to go together.'''
        3-5:
          cognitiveModeLabel: Comparison
          studentFacingDescription: I can see how two things are similar and different — and
            I can ask whether one thing might affect the other.
          classroomInstantiation: Comparing subsistence strategies across environments and asking
            whether the environment affects which strategy is used; comparing allele frequencies
            before and after selection and asking what caused the change; comparing story versions
            and asking what might have caused the changes.
          educatorBridgingNote: 'At 3–5, relationship becomes comparative: students can systematically
            compare two things and begin to ask causal questions. The key epistemic move is
            from ''these go together'' to ''might one cause the other?'' Introduce the idea
            that scientists need more than one example to establish a relationship — a single
            case could be coincidence.'
        6-8:
          cognitiveModeLabel: Proportionality and causation
          studentFacingDescription: I can measure how strongly two things are related — and
            I can ask whether the relationship is causal or just correlational.
          classroomInstantiation: Plotting social connectedness vs. longevity in baboons and
            measuring the strength of the relationship; applying Hamilton's Rule as a proportional
            relationship (degree of relatedness predicts degree of helping); analyzing scatter
            plots of genetic diversity vs. distance from Africa.
          educatorBridgingNote: 'At 6–8, introduce the correlation-causation distinction explicitly.
            Use the baboon social bonds data: social connectedness correlates with longevity
            — but does being social cause longer life, or do healthier animals form more social
            bonds? This is a genuine scientific puzzle. The key skill is identifying at least
            one alternative explanation for any observed correlation before claiming causation.'
        9-12:
          cognitiveModeLabel: Functional and systemic
          studentFacingDescription: I can specify the causal mechanism linking two variables
            — and I can test whether that mechanism produces the observed relationship.
          classroomInstantiation: 'Gene-culture coevolution: dairy farming → selection on LCT
            → lactase persistence — a causal chain with a specifiable mechanism; coevolutionary
            relationships between cultural norms and genetic predispositions; network relationships
            in primate social systems where the mechanism linking centrality to fitness is specified.'
          educatorBridgingNote: At 9–12, students are expected to specify mechanisms, not just
            observe correlations. The key question shifts from 'do these things correlate?'
            to 'by what mechanism does one affect the other, and what evidence would allow us
            to rule out alternative mechanisms?' This is the hallmark of mature scientific reasoning
            and connects directly to the Capstone rubric criterion on competing hypotheses.
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: Babies look like their parents — that relationship tells us something is being
          passed from parent to child.
      - gradeBand: 3-5
        example: Cultures that live in grasslands tend to be herders — is there a relationship
          between environment and food strategy?
      - gradeBand: 6-8
        example: Baboons with more social bonds live longer — but is that because being social
          is healthy, or because healthy baboons make more friends?
      - gradeBand: 9-12
        example: Dairy farming created a new relationship between cultural practice and genetic
          fitness — populations that herded cattle benefited from lactase persistence, creating
          a gene-culture coevolutionary dynamic.
      oe:scopeNote: 'Relationship is the bridge concept between observation and causation. At
        K–2 it is simply ''these two things go together''; by 9–12 it is a formal causal or
        coevolutionary relationship that can be quantified and modeled. A persistent challenge
        in teaching relationship is the correlation-causation distinction: students must learn
        that two things co-varying does not establish that one causes the other. This distinction
        is introduced at 6–8 and becomes a criterion for epistemic humility at 9–12.'
  - id: OE-CONCEPT-000303
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: System
    definitions:
      en:
        general: 'A set of interacting components whose collective behavior produces properties
          not reducible to any single component. In evolutionary anthropology: ecological systems
          humans inhabit and modify, cultural transmission systems, gene regulatory networks,
          primate social systems, language families as systems of related varieties.'
    aliases:
      en:
      - complex system
      - interacting parts
      - emergent whole
      - network
      - ecology
    relations:
      skos:related:
      - OE-CONCEPT-000309
      - OE-CONCEPT-000301
      - OE-CONCEPT-000302
      - OE-CONCEPT-000308
      - OE-CONCEPT-000313
    citations:
    - text: 'Holland, J. H. (1995). Hidden Order: How Adaptation Builds Complexity. Addison-Wesley.'
      url: https://openalex.org/W2067123456
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/system
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Parts and wholes
          studentFacingDescription: Things are made of parts that work together — and the whole
            is different from just the parts alone.
          classroomInstantiation: A family is a system — each person plays a different role,
            and the family together can do things no single person could alone; a forest is
            a system — trees, animals, soil, and water all interact; a community teaching chain
            involves many people whose interactions pass knowledge forward.
          educatorBridgingNote: 'At K–2, system is introduced through familiar wholes: family,
            community, classroom, forest. The key idea is that the parts interact — they affect
            each other — and the whole can do things no single part could. Language to model:
            ''The forest works together like a team — if one part changes, it affects the others.''
            Do not yet name feedback or emergence; those appear at 6-8.'
        3-5:
          cognitiveModeLabel: Interacting components
          studentFacingDescription: The parts of a system interact with each other — changing
            one part can change how the whole system works.
          classroomInstantiation: Modeling how a subsistence strategy interacts with the local
            environment — if the environment changes, the strategy must change too; showing
            how a change in one allele frequency affects the whole population's biology; demonstrating
            how a language borrowing a word changes its relationship to related languages.
          educatorBridgingNote: 'At 3–5, students begin to understand that systems are dynamic
            — changing one part ripples through the whole. The key new move is tracing the chain
            of effects: ''If this changes, then what changes next?'' This is the foundation
            for understanding feedback at 6-8. Use simple two-component systems first before
            introducing multi-component complexity.'
        6-8:
          cognitiveModeLabel: Feedback and regulation
          studentFacingDescription: Systems often regulate themselves — the output of a process
            feeds back to affect the process itself, creating loops that can stabilize or amplify
            change.
          classroomInstantiation: 'Kinship systems as self-regulating social systems: marriage
            rules and resource inheritance rules create feedback loops that maintain group cooperation;
            social norm enforcement as a feedback system: violations are punished, which reduces
            violations, which maintains the norm; population growth as a feedback system with
            ecological limits.'
          educatorBridgingNote: 'At 6–8, introduce feedback as the mechanism by which systems
            regulate themselves. Use concrete examples before abstract definitions. The kinship
            system is ideal: it has input (new members), processing (marriage and inheritance
            rules), and output (resource distribution) — and the output affects who becomes
            a new member. Connect explicitly to the Feedback concept.'
        9-12:
          cognitiveModeLabel: Emergent and formally modeled
          studentFacingDescription: Complex systems produce emergent properties that cannot
            be predicted from the parts alone — and formal models (agent-based, mathematical,
            computational) can help us understand how they arise.
          classroomInstantiation: Agent-based models of cultural transmission showing how conformity
            bias at the individual level produces population-level cultural homogeneity; gene-culture
            coevolution as a coupled dynamical system; ecological systems with multiple stable
            states; social network dynamics where individual relationship decisions produce
            global network properties.
          educatorBridgingNote: 'At 9–12, emergence is the key system concept: properties that
            appear at the system level but cannot be found in any single component. Cooperation
            is an emergent property of a social system — you cannot find cooperation in a single
            individual, only in their interactions. Agent-based models are particularly powerful
            here because they make emergence visible: simple rules generate complex collective
            behavior.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: A family is a system — each person plays a role, and together they can do things
          no one person could do alone.
      - gradeBand: 3-5
        example: 'A subsistence strategy is part of a system: the environment affects what food
          is available, which affects which strategy works, which affects how the community
          is organized.'
      - gradeBand: 6-8
        example: A kinship system is a social system that regulates who helps whom through rules
          about marriage, descent, and inheritance — changing one rule ripples through the whole
          system.
      - gradeBand: 9-12
        example: 'Gene-culture coevolution is a coupled dynamical system: cultural practices
          (like dairy farming) create selection pressure on genes (LCT), and genetic changes
          (lactase persistence) enable cultural practices to spread further — each influences
          the other.'
      oe:scopeNote: 'System thinking is the capacity to see wholes rather than isolated parts
        — to ask not just ''what is this component?'' but ''how do the components interact,
        and what emerges from those interactions?'' This is essential in evolutionary anthropology
        because most phenomena of interest (cooperation, cultural evolution, gene-culture coevolution,
        primate social life) are emergent properties of interacting systems, not products of
        single causes. The challenge in teaching systems is preventing reductionism: students
        must learn that understanding the parts is necessary but not sufficient.'
  - id: OE-CONCEPT-000304
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Information
    definitions:
      en:
        general: 'A pattern that reduces uncertainty and can be encoded, transmitted, stored,
          and interpreted. In evolutionary anthropology: DNA as biological information encoding
          ancestry and function, fossil evidence as environmental and anatomical information,
          linguistic cognates as historical information about population movements, genomic
          data as compressed population history.'
    aliases:
      en:
      - data
      - signal
      - evidence
      - encoding
      - biological information
      - knowledge
    relations:
      skos:related:
      - OE-CONCEPT-000305
      - OE-CONCEPT-000306
      - OE-CONCEPT-000300
      - OE-CONCEPT-000307
      - OE-CONCEPT-000312
      - OE-CONCEPT-000314
      - OE-CONCEPT-000315
    citations:
    - text: Shannon, C. E. (1948). A Mathematical Theory of Communication. Bell System Technical
        Journal, 27(3), 379–423.
      url: https://openalex.org/W2963403868
    - text: Maynard Smith, J. (2000). The concept of information in biology. Philosophy of Science,
        67(2), 177–194.
      url: https://openalex.org/W2051987654
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/information
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Observation and naming
          studentFacingDescription: I can find out things about the world by looking carefully
            — what I observe tells me something.
          classroomInstantiation: Observing fossil casts and naming what they tell us about
            the animal; looking at family photos to find information about inherited traits;
            watching primate videos and recording what behaviors we observe.
          educatorBridgingNote: 'At K–2, information is entirely concrete: it is what you find
            out by looking carefully. The key vocabulary is ''this tells us that...'' and ''I
            found out that...'' Teacher language: ''This fossil tells us that this animal had
            sharp teeth — that''s information scientists can use.'' The distinction between
            observation and inference can begin here very gently: ''We can see the teeth — we
            are inferring that it ate meat.'''
        3-5:
          cognitiveModeLabel: Evidence and claims
          studentFacingDescription: Information is evidence — it supports or challenges specific
            claims. Better information leads to better-supported claims.
          classroomInstantiation: Using DNA mutation simulation results as evidence for the
            molecular clock claim; using cognate tables as evidence for language family relationships;
            sorting 'strong evidence,' 'weak evidence,' and 'not evidence' cards in a classification
            activity.
          educatorBridgingNote: 'At 3–5, information becomes relational — it is always information
            for or against something. Introduce the vocabulary of evidence explicitly and connect
            it to the CER framework. A key insight: more information is not always better —
            irrelevant information does not strengthen a claim. Students should begin to ask
            ''Is this information relevant to this claim?'' not just ''Do I have information?'''
        6-8:
          cognitiveModeLabel: Data quality and source critique
          studentFacingDescription: Not all information is equally reliable — I need to ask
            where it came from, how it was collected, from what sample, and what assumptions
            the collection method makes.
          classroomInstantiation: Critiquing haplogroup sampling bias in genetic databases;
            identifying WEIRD bias in psychological survey samples; evaluating the taphonomic
            filter on fossil evidence; comparing the resolution of different dating methods.
          educatorBridgingNote: 'At 6–8, the key move is from ''what does this information say?''
            to ''how good is this information?'' Students should learn to ask systematically:
            Who collected it? How? From what sample? With what assumptions? What could go wrong?
            This is the methodological dimension of information — CCT.EVID-METHOD made concrete.
            The WEIRD critique is a perfect example: survey information collected only from
            WEIRD populations is biased information, regardless of how carefully the surveys
            were conducted.'
        9-12:
          cognitiveModeLabel: Epistemology and information theory
          studentFacingDescription: Information reduces uncertainty — and different types of
            information reduce different kinds of uncertainty. Convergent evidence from independent
            methods provides stronger grounds for a claim than any single source.
          classroomInstantiation: 'Analyzing how ancient DNA, fossil morphology, and linguistic
            phylogenetics each reduce different kinds of uncertainty about the Bronze Age Steppe
            expansion; applying Bayesian reasoning to update confidence in hypotheses as evidence
            accumulates; distinguishing between types of information: observation, inference,
            model output, simulation result.'
          educatorBridgingNote: 'At 9–12, information becomes epistemological: students should
            understand that convergent evidence from independent methods is epistemologically
            powerful because independent methods have independent failure modes — if three methods
            that fail for different reasons all point to the same conclusion, the conclusion
            is strongly supported. This is the logic behind multi-strand synthesis and the Capstone
            requirement for evidence from at least four strands.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: This fossil has very long leg bones — that information tells scientists this
          animal was probably a fast runner.
      - gradeBand: 3-5
        example: The cognate table is information — it tells us which languages are related
          to each other because they share similar words for basic concepts.
      - gradeBand: 6-8
        example: Haplogroup maps are information — but they are biased information because most
          of the reference samples come from North America and Europe, not from the populations
          with the most ancient genetic lineages.
      - gradeBand: 9-12
        example: Ancient DNA, linguistic phylogenetics, and archaeological culture all provide
          information about the Bronze Age Steppe expansion — because they are independent evidence
          sources, their convergence is much more convincing than any one source alone.
      oe:scopeNote: Information is perhaps the deepest cross-disciplinary compression concept
        in the framework — it links biology (DNA as information), cognition (knowledge as information),
        culture (traditions as transmitted information), and epistemology (evidence as information
        that reduces uncertainty). The key progression is from information as something observed
        (K-2) to information as something evaluated (6-8) to information as an epistemological
        object with philosophical properties (9-12). A critical teaching move at 6-8 is establishing
        that all information has a source, a collection method, and limits — it is never neutral.
  - id: OE-CONCEPT-000305
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Representation
    definitions:
      en:
        general: 'The use of one form to stand for and communicate another form or phenomenon.
          In evolutionary anthropology: phylogenetic trees standing for evolutionary relationships,
          geological timelines standing for deep time, genome browsers standing for molecular
          architecture, ADMIXTURE bar charts standing for population ancestry proportions, kinship
          diagrams standing for social structure.'
    aliases:
      en:
      - model
      - symbol
      - diagram
      - encoding
      - formal notation
      - analogy
      - visualization
    relations:
      skos:related:
      - OE-CONCEPT-000304
      - OE-CONCEPT-000306
      - OE-CONCEPT-000300
      - OE-CONCEPT-000312
      - OE-CONCEPT-000314
    citations:
    - text: 'Goodman, N. (1976). Languages of Art: An Approach to a Theory of Symbols. Hackett
        Publishing.'
      url: https://openalex.org/W2012398765
    - text: 'Ainsworth, S. (2006). DeFT: A conceptual framework for considering learning with
        multiple representations. Learning and Instruction, 16(3), 183–198.'
      url: https://openalex.org/W2051876543
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/representation
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Pictures and words
          studentFacingDescription: A picture or a word can stand for a real thing — it is a
            way of showing or telling what something is like.
          classroomInstantiation: Drawing a teaching chain diagram to show who taught whom;
            making a labeled picture of a fossil; placing pictures of animals on a family tree
            diagram; using arrows to show the direction information travels.
          educatorBridgingNote: 'At K–2, representation is entirely iconic — pictures that resemble
            what they represent, arrows that point in the direction of flow, diagrams that look
            like their referents. The key vocabulary is ''this stands for'' and ''this shows.''
            Teacher language: ''This arrow shows that the skill traveled from grandma to mom
            to you — the arrow is a way of representing something that really happened.'' Do
            not yet introduce the idea that representations involve choices — that appears at
            6-8.'
        3-5:
          cognitiveModeLabel: Diagrams and data tables
          studentFacingDescription: I can represent information using organized tables, charts,
            and diagrams — and different kinds of representations help me see different things.
          classroomInstantiation: Building a proportionally scaled timeline of hominin species;
            creating a data table comparing primate life history variables; drawing a language
            family tree; making a bar chart of fairness norm survey results.
          educatorBridgingNote: 'At 3–5, students make the transition from single representations
            to multiple representation types — and begin to understand that different representations
            reveal different features. A data table shows all values precisely but makes trends
            harder to see; a line graph shows trends but hides individual values. Introduce
            the question: ''Which representation is best for this question?'' — helping students
            see representation as a tool choice, not a neutral recording.'
        6-8:
          cognitiveModeLabel: Variables and formal notation
          studentFacingDescription: Scientific representations use formal notation — variables,
            coordinates, symbols — that compresses complex information into precise, communicable
            form. But the notation embeds choices about what matters.
          classroomInstantiation: Interpreting scatter plots of cranial variables across hominin
            species; reading haplogroup maps as compressed representations of population history;
            using genome browser tracks as formal representations of molecular architecture;
            reading Hamilton's Rule (rb > c) as a formal representation of the logic of kin
            selection.
          educatorBridgingNote: At 6–8, students encounter formal scientific notation for the
            first time in this framework — variables, algebraic expressions, statistical plots.
            The key meta-insight is that these notations are not just shorthand; they embody
            theoretical commitments. A scatter plot assumes that two variables are the most
            important ones; a phylogenetic tree assumes branching history is the dominant signal.
            Asking 'what does this representation assume?' is a form of methods critique.
        9-12:
          cognitiveModeLabel: Representations as epistemological choices
          studentFacingDescription: Every scientific representation embeds theoretical commitments
            and makes choices about what to include and exclude. Critiquing a representation
            is part of evaluating the evidence it contains.
          classroomInstantiation: 'Evaluating ADMIXTURE bar charts: what does the K value mean?
            What does ancestry proportion actually represent? What can this representation never
            show? Interpreting Bayesian phylogenetic trees: what do branch lengths represent?
            What does posterior probability mean? Why does a reticulate network sometimes better
            represent the data than a bifurcating tree?'
          educatorBridgingNote: 'At 9–12, representation becomes an epistemological object —
            students must be able to critique representations, not just read them. Key questions
            for any scientific representation: What data generated this? What model assumptions
            does it embed? What features of the underlying reality does it make invisible? What
            alternative representation would highlight different features? This level of representation
            literacy is essential for reading primary literature critically.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: This arrow in my teaching chain diagram represents the path knowledge traveled
          from my grandmother to my mother to me.
      - gradeBand: 3-5
        example: This branching tree diagram represents which languages are related to which
          other languages — languages on the same branch are more closely related.
      - gradeBand: 6-8
        example: This scatter plot represents the relationship between brain size and group
          size across primate species — each dot represents one species, and its position encodes
          two variables at once.
      - gradeBand: 9-12
        example: An ADMIXTURE bar chart represents ancestry proportion estimates — but the number
          of assumed ancestral populations (K) is a researcher choice that affects what the
          chart shows, not a fact about the populations themselves.
      oe:scopeNote: Representation is tied with Information for the highest compression score
        in the framework (0.97). It is the concept through which all scientific knowledge is
        communicated — there is no science without representation. The key developmental insight
        is that representations are not neutral windows onto reality; they are human constructions
        that make certain features visible and others invisible, that embody theoretical commitments,
        and that can mislead as well as illuminate. By 9–12, students must be able to ask not
        just 'what does this representation show?' but 'what does this representation hide,
        and why was it built this way?'
  - id: OE-CONCEPT-000306
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Argument
    definitions:
      en:
        general: 'A structured claim supported by reasoning and evidence, designed to persuade
          or explain. In evolutionary anthropology: marshaling fossil, genomic, linguistic,
          and behavioral evidence to support or challenge evolutionary hypotheses; evaluating
          competing models of cooperation, human origins, or language evolution; acknowledging
          the strongest counterevidence while defending a position.'
    aliases:
      en:
      - evidence-based claim
      - scientific reasoning
      - structured argument
      - hypothesis evaluation
      - CER
    relations:
      skos:related:
      - OE-CONCEPT-000304
      - OE-CONCEPT-000307
      - OE-CONCEPT-000305
      - OE-CONCEPT-000312
    citations:
    - text: McNeill, K. L., & Krajcik, J. (2011). Supporting Grade 5–8 Students in Constructing
        Explanations in Science. Pearson.
    - text: Toulmin, S. (1958). The Uses of Argument. Cambridge University Press.
      url: https://openalex.org/W2051234890
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/argument
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Opinion with reason
          studentFacingDescription: I think this because... — I can say what I think and give
            one reason.
          classroomInstantiation: Students say which primate behavior is most similar to human
            behavior and give one reason; students explain which family member a baby picture
            looks most like and why; students predict what a community needed most long ago
            and give a reason.
          educatorBridgingNote: 'At K–2, argument is introduced as the simple move of backing
            a claim with a reason — ''I think... because...'' This is not yet CER; it is the
            pre-formal foundation. The key is establishing the habit of giving reasons, not
            just assertions. Model it constantly: ''I think this fossil is a carnivore because
            look at those pointed teeth — the teeth are my reason.'' The word ''because'' is
            the K-2 argument connector.'
        3-5:
          cognitiveModeLabel: Claim plus evidence — CER formally introduced
          studentFacingDescription: 'A good scientific argument has three parts: a specific
            claim, evidence that supports it, and reasoning that connects the evidence to the
            claim.'
          classroomInstantiation: Writing CER paragraphs about natural selection simulation
            results; building cognate table arguments for language family relationships; arguing
            for one subsistence strategy as better adapted to a specific environment using data
            table evidence.
          educatorBridgingNote: 'At 3–5, introduce the Claim-Evidence-Reasoning framework explicitly
            and use it consistently across all strands and subjects. Use the same language everywhere:
            ''What is your claim? What is your evidence? How does the evidence support the claim?''
            The key new move is distinguishing evidence (what you observed) from reasoning (how
            the observation supports the claim) — many students initially conflate these. Give
            practice identifying reasoning vs. evidence in worked examples.'
        6-8:
          cognitiveModeLabel: Counterclaim and rebuttal
          studentFacingDescription: A strong scientific argument doesn't just present evidence
            for a claim — it also addresses the best evidence against the claim and explains
            why the claim is still supported.
          classroomInstantiation: Writing position papers on kin selection sufficiency that
            address the strongest cooperation evidence that kin selection cannot explain; arguing
            for a taxonomic classification of a hominin species while acknowledging morphological
            evidence for alternative classifications; debating whether chimpanzee behavioral
            variation qualifies as culture, engaging both sides.
          educatorBridgingNote: 'At 6–8, the critical move is engaging the best opposing evidence
            — not strawmanning a weak version of the other side. Use structured academic controversy
            protocols: students must be able to argue both sides before they write their own
            position. The framing: ''A scientist who disagrees with me would point to... and
            I would respond by...'' This is the 6-8 rubric criterion (counterevidence engagement)
            made explicit.'
        9-12:
          cognitiveModeLabel: Theoretical justification with uncertainty
          studentFacingDescription: A mature scientific argument specifies the theoretical framework
            it operates within, quantifies its confidence level, names what would change its
            conclusions, and honestly acknowledges what remains genuinely unknown.
          classroomInstantiation: Position papers on competing cooperation models that explicitly
            engage Bayesian reasoning about which model has higher posterior probability given
            available evidence; Capstone synthesis that integrates evidence from four or more
            strands with explicit uncertainty acknowledgment; evaluating modern human origins
            models with named confidence levels for each claim.
          educatorBridgingNote: 'At 9–12, the key sophistication is epistemic calibration: students
            should be able to distinguish between claims they are highly confident in (well-supported
            by convergent independent evidence), claims they are moderately confident in (supported
            by some evidence but contested), and claims that are genuinely open (insufficient
            evidence to choose between alternatives). Epistemic humility is not intellectual
            cowardice — it is accurate accounting of what is and isn''t known. This is a rubric
            criterion at this band.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: I think this baby looks most like the mother because they both have the same
          nose shape.
      - gradeBand: 3-5
        example: 'Claim: These three languages are related. Evidence: They share 12 cognates
          in basic vocabulary. Reasoning: Languages that share this many basic cognates likely
          descended from a common ancestor language, because basic vocabulary is rarely borrowed.'
      - gradeBand: 6-8
        example: Kin selection can explain cooperation among relatives, but it struggles to
          explain why humans cooperate with strangers in large anonymous groups. A scientist
          who supports kin selection might argue that extended kinship networks solve this —
          but the empirical evidence from cross-cultural experiments suggests this explanation
          is insufficient.
      - gradeBand: 9-12
        example: The African multiregionalism model is better supported than simple recent African
          origin because it is consistent with the fossil evidence from Jebel Irhoud AND the
          ancient DNA evidence for structured African populations — convergent evidence from
          independent methods. However, I acknowledge that the admixture patterns within Africa
          remain poorly resolved due to limited ancient African DNA samples, which is a genuine
          limitation of current evidence.
      oe:scopeNote: 'Argument is the primary vehicle of scientific communication — it is how
        knowledge claims are made, evaluated, and revised. The Eva4K12 framework treats argument
        as a learnable skill that develops from simple opinion-giving (K-2) through structured
        claim-evidence-reasoning (3-5) and counterclaim engagement (6-8) to full theoretical
        justification with quantified uncertainty (9-12). A key insight for educators: scientific
        argument is not debate in the adversarial sense — it is collaborative knowledge-building
        in which the goal is to get closer to the truth, not to win.'
  - id: OE-CONCEPT-000307
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Perspective
    definitions:
      en:
        general: 'The position, context, or standpoint from which a phenomenon is observed,
          interpreted, or experienced, which shapes what is visible and what is invisible. In
          evolutionary anthropology: WEIRD bias in psychology research; observer effects in
          ethnography; Indigenous knowledge frameworks as alternative valid epistemologies;
          whose populations define ''normal'' human behavior; positionality of researchers in
          colonial contexts.'
    aliases:
      en:
      - point of view
      - positionality
      - standpoint
      - epistemic position
      - bias
      - frame
    relations:
      skos:related:
      - OE-CONCEPT-000306
      - OE-CONCEPT-000211
      - OE-CONCEPT-000304
      - OE-CONCEPT-000311
      - OE-CONCEPT-000314
      - OE-CONCEPT-000315
    citations:
    - text: Henrich, J., Heine, S. J., & Norenzayan, A. (2010). The weirdest people in the world?.
        Behavioral and Brain Sciences, 33(2–3), 61–83.
      url: https://openalex.org/W2162649359
    - text: Longino, H. E. (1990). Science as Social Knowledge. Princeton University Press.
      url: https://openalex.org/W2059012345
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/perspective
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Character feelings
          studentFacingDescription: Different people feel and see things differently — I can
            try to understand how something looks from someone else's point of view.
          classroomInstantiation: Discussing how different characters in a folktale feel about
            the same event; asking how a chimpanzee might 'see' the pointing gesture differently
            than a human does; considering how an elder who taught a tradition might feel about
            it changing.
          educatorBridgingNote: 'At K–2, perspective is introduced through the most accessible
            form of perspective-taking: characters in stories and the experiences of other people
            and animals. This is developmentally appropriate — theory of mind (the capacity
            to represent other minds) emerges between ages 3-5 and develops throughout childhood.
            The key vocabulary is ''from their point of view'' and ''they might think/feel...''
            This is the foundation for the much more abstract epistemic perspective-taking at
            6-8.'
        3-5:
          cognitiveModeLabel: Author purpose
          studentFacingDescription: Writers and researchers have purposes and viewpoints that
            shape what they include and what they leave out — I can ask 'who made this and why?'
          classroomInstantiation: Asking whose perspective is represented in a textbook account
            of human origins; identifying which cultures are included (and which are absent)
            in a cross-cultural study; noticing whose stories appear in a folklore collection
            and whose do not.
          educatorBridgingNote: 'At 3–5, perspective expands from characters to authors and
            researchers — people who made the texts and data students encounter. The key new
            move is asking ''who is not represented here?'' — the absent perspectives are often
            as informative as the present ones. In evolutionary anthropology, this often means
            asking: whose populations have been studied? Whose knowledge traditions have been
            included? This sets up the WEIRD critique at 6-8.'
        6-8:
          cognitiveModeLabel: Bias and framing in research
          studentFacingDescription: Research design embeds perspectives — who is studied, what
            questions are asked, what counts as evidence, and whose framework is used to interpret
            results all reflect the researchers' position.
          classroomInstantiation: Applying the WEIRD critique to a specific psychology study;
            identifying how the framing of 'behavioral modernity' in paleoanthropology reflects
            particular cultural assumptions; analyzing whose communities are sampled in genetic
            databases and what this means for claims about human diversity.
          educatorBridgingNote: 'At 6–8, perspective becomes methodological — it is embedded
            in research design choices, not just individual attitudes. The WEIRD critique is
            the most accessible entry point: most psychology research was done on WEIRD populations,
            which means conclusions about ''human'' behavior were actually conclusions about
            WEIRD behavior. Extend to genetics: most genomic databases over-represent European
            populations. The key skill is identifying the structural, not just individual, sources
            of perspective in scientific knowledge.'
        9-12:
          cognitiveModeLabel: Epistemic positionality and science studies
          studentFacingDescription: Knowledge is always produced from somewhere — the positionality
            of researchers (their culture, era, funding sources, institutional context) shapes
            what questions are asked and what counts as a valid answer. Understanding this is
            part of evaluating any scientific claim.
          classroomInstantiation: Analyzing how the history of scientific racism in anthropology
            shaped what questions were asked about human diversity; evaluating how Indigenous
            knowledge frameworks offer alternative valid perspectives on ecological and social
            phenomena studied in evolutionary anthropology; examining how funding sources and
            publication incentives shape research in behavioral ecology.
          educatorBridgingNote: At 9–12, perspective becomes science-studies level — students
            engage with the sociology and philosophy of knowledge production itself. This is
            not relativism ('all perspectives are equally valid') but nuanced epistemology ('all
            knowledge is produced from somewhere, and understanding where it was produced helps
            evaluate its validity'). Connect directly to CCT.ORIGIN-SCI. The anti-racist framing
            of genetics content is itself a perspective choice — one the framework makes explicitly
            and defends.
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: From the wolf's point of view in Little Red Riding Hood, the story might seem
          very different than it does from Red Riding Hood's perspective.
      - gradeBand: 3-5
        example: This psychology study says children naturally share fairly — but it only studied
          children from one country. Whose perspective is missing from this conclusion?
      - gradeBand: 6-8
        example: Most psychology research has been done on WEIRD populations — Western, Educated,
          Industrialized, Rich, Democratic. That perspective is built into the research design,
          which means claims about 'human nature' from that research might really be claims
          about WEIRD nature.
      - gradeBand: 9-12
        example: Early 20th-century physical anthropologists asked 'how do racial groups differ?'
          — a question that embedded assumptions about discrete biological races. Contemporary
          evolutionary anthropologists ask 'how is genetic variation distributed across populations?'
          — a different question that reflects a different perspective on what is worth measuring
          and why.
      oe:scopeNote: 'Perspective is both a social-emotional concept (understanding others''
        feelings and views) and an epistemological one (understanding how one''s position shapes
        what one can know). The Eva4K12 framework develops both dimensions but emphasizes the
        epistemological dimension increasingly from 6-8 onward. The WEIRD critique is the clearest
        example: the perspective embedded in research design (studying mainly WEIRD populations)
        shaped what psychology presented as universal human nature. By 9-12, students should
        understand perspective not just as individual bias but as structural feature of knowledge
        production.'
  - id: OE-CONCEPT-000308
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Scale
    definitions:
      en:
        general: 'The level of organization or resolution at which a system is observed or analyzed.
          In evolutionary anthropology: geological and evolutionary deep time vs. human lifespan;
          individual organism vs. population vs. species level; molecular vs. anatomical vs.
          behavioral levels of evolutionary analysis; local community vs. global cross-cultural
          comparison.'
    aliases:
      en:
      - deep time
      - levels of organization
      - spatial scale
      - temporal scale
      - resolution
      - magnitude
    relations:
      skos:related:
      - OE-CONCEPT-000303
      - OE-CONCEPT-000300
      - OE-CONCEPT-000101
      - OE-CONCEPT-000310
    citations:
    - text: 'Catley, K. M., & Novick, L. R. (2009). Digging deep: Exploring college students''
        knowledge of macroevolutionary time. Evolution: Education and Outreach, 2(2), 307–329.'
      url: https://openalex.org/W2038452721
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/scale
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Big/small/long-ago/now
          studentFacingDescription: Some things are very big, some are very small — some things
            happened a very long time ago, some happened just now.
          classroomInstantiation: Ordering pictures from smallest to largest, oldest to newest;
            placing 'me,' 'grandparent,' and 'dinosaurs' on a simplified timeline with very
            different distances; comparing the size of a cell to the size of an organism using
            nested diagrams.
          educatorBridgingNote: At K–2, scale is entirely perceptual and comparative — students
            can order things by size or time but cannot yet measure scale numerically. The key
            vocabulary is 'longer ago,' 'much bigger,' 'tiny compared to.' The goal is building
            an emotional sense that time and space stretch enormously beyond everyday experience.
            Use physical walk-throughs and paper strip timelines to make scale embodied, not
            abstract.
        3-5:
          cognitiveModeLabel: Measurement units and timelines
          studentFacingDescription: I can measure scale using units — and I can represent very
            large or very small scales by choosing appropriate units and drawing proportionally.
          classroomInstantiation: Constructing a proportionally scaled hominin timeline (1 cm
            = 100,000 years); calculating how far back 3.5 million years (Australopithecus)
            is on a toilet-paper timeline; placing human civilization (last 10,000 years) on
            an Earth history timeline and seeing how tiny it is.
          educatorBridgingNote: 'At 3–5, scale becomes mathematical — students must actually
            compute and draw proportional representations of time. This is the critical intervention
            for deep time intuition: experiencing in your hands how far back 300,000 years is
            compared to 3 million years. Connect to CCSS Mathematics proportional reasoning.
            The cognitive goal is visceral appreciation of scale, not just number manipulation.'
        6-8:
          cognitiveModeLabel: Rates of change and cross-scale phenomena
          studentFacingDescription: 'Different processes operate at different scales — and what
            looks like a pattern at one scale may look different at another. I can ask: at what
            scale is this process operating?'
          classroomInstantiation: Comparing rates of genetic change (very slow — millions of
            years) to rates of cultural change (very fast — years to centuries); understanding
            that molecular clock rates are calibrated at a different temporal resolution than
            fossil dates; analyzing how local adaptation (small spatial scale) contributes to
            global human diversity (large spatial scale).
          educatorBridgingNote: 'At 6–8, scale becomes analytical: students ask what scale a
            process operates at and what that implies for the methods used to study it. A key
            insight: the appropriate method depends on the scale of the question. Fossil dates
            are appropriate for millions-of-years questions; radiocarbon is appropriate for
            thousands-of-years questions; written records are appropriate for hundreds-of-years
            questions. Mismatching method and scale produces misleading answers.'
        9-12:
          cognitiveModeLabel: Cross-scale causation and deep-time inference
          studentFacingDescription: Causes operating at one scale produce effects visible at
            another — understanding evolutionary anthropology requires moving fluently between
            molecular, organismal, population, and cultural scales, and understanding how processes
            at each scale constrain and enable processes at others.
          classroomInstantiation: Tracing how a single nucleotide change (molecular scale) affects
            protein function (cellular scale), which affects phenotype (organismal scale), which
            affects fitness (population scale), which produces allele frequency change detectable
            in ancient DNA studies (temporal scale of thousands of years); modeling how individual
            learning biases (cognitive scale) aggregate to produce cultural patterns (population
            scale) across generations (evolutionary time scale).
          educatorBridgingNote: 'At 9–12, cross-scale causation is the key sophistication: causes
            at one level of organization produce effects at other levels, and understanding
            the mechanism requires moving between scales fluently. This is also where deep-time
            inference meets its limits — coalescent theory can estimate divergence dates, but
            the error ranges grow as we go further back. Epistemic humility about deep-time
            claims is a function of understanding scale resolution.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: Your great-great-great-great-grandparents lived a very long time ago — but
          early humans lived even much, much longer ago than that.
      - gradeBand: 3-5
        example: If we made a timeline where 1 centimeter equals 100,000 years, early Homo sapiens
          (300,000 years ago) would be only 3 centimeters away — but the first hominins (7 million
          years ago) would be 70 meters away.
      - gradeBand: 6-8
        example: Genetic mutations accumulate at a roughly predictable rate — so scientists
          can estimate how long ago two populations diverged by counting the mutations that
          separate them. But this clock has error ranges that grow with distance in time.
      - gradeBand: 9-12
        example: A single regulatory mutation (molecular scale) in the HACNS1 enhancer region
          changed the expression of genes in developing human limbs (cellular/developmental
          scale), which altered limb proportions (organismal scale), which may have contributed
          to the evolution of bipedalism (population/evolutionary scale over hundreds of thousands
          of years).
      oe:scopeNote: Scale is the concept that most directly enables deep time thinking — a signature
        challenge of evolutionary anthropology. Humans have strong intuitions about the scales
        of everyday life (seconds to decades, meters to kilometers) and almost no intuitions
        about geological and evolutionary scales (millions of years, planetary distances). Building
        scale intuition requires repeated, concrete, embodied experience — not just being told
        numbers. The toilet paper timeline and classroom walk-throughs are pedagogically essential,
        not optional enrichment.
  - id: OE-CONCEPT-000309
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Feedback
    definitions:
      en:
        general: 'A process in which system outputs are routed back as inputs, regulating or
          amplifying behavior over time. In evolutionary anthropology: gene-culture coevolution
          (cultural practices change selective environments which change genes which change
          cultural capacity), niche construction feedback, social norm enforcement loops, cumulative
          culture ratchet, hormonal feedback in primate stress response.'
    aliases:
      en:
      - feedback loop
      - regulation
      - coevolution
      - reciprocal causation
      - ratchet
      - amplification
    relations:
      skos:related:
      - OE-CONCEPT-000303
      - OE-CONCEPT-000101
      - OE-CONCEPT-000302
      - OE-CONCEPT-000315
    citations:
    - text: Laland, K. N., Odling-Smee, J., & Feldman, M. W. (2000). Niche construction, biological
        evolution, and cultural change. Behavioral and Brain Sciences, 23(1), 131–146.
      url: https://openalex.org/W2067890123
    extensions:
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/concepts/eva/feedback
      oe:developmentalArc:
        K-2:
          cognitiveModeLabel: Cause-effect chains as precursor
          studentFacingDescription: When one thing happens, it can cause another thing to happen
            — and that second thing might cause something else.
          classroomInstantiation: 'Tracing a chain: grandmother teaches mother → mother teaches
            child → child teaches their own child — knowledge travels forward through teaching;
            noticing that when a community maintains a tradition, the tradition stays alive,
            which makes it more likely the next generation will learn it.'
          educatorBridgingNote: 'At K–2, feedback is not named as such — instead, students encounter
            cause-effect chains that will later be recognized as simple feedback loops. The
            key pre-feedback concept is sequential causation: A causes B, B causes C. Use visual
            arrow chains to make this concrete. Do not introduce the concept of loops at this
            level — that requires understanding that an output can become an input, which is
            conceptually demanding and belongs at 3-5.'
        3-5:
          cognitiveModeLabel: Reciprocal causation
          studentFacingDescription: Sometimes two things affect each other — not just A causes
            B, but B also affects A. They influence each other back and forth.
          classroomInstantiation: Understanding that a community with a strong teaching tradition
            produces more skilled teachers, who produce a stronger teaching tradition — a reinforcing
            loop; showing how natural selection changes allele frequencies, and changed allele
            frequencies change what traits are available for selection to act on; noticing that
            more cooperation enables larger groups, and larger groups enable more cooperation.
          educatorBridgingNote: 'At 3–5, introduce the idea of reciprocal causation: A affects
            B, and B affects A. Use everyday examples first: ''Being good at something makes
            you practice more, and practicing more makes you better at it.'' Then apply to evolutionary
            examples. The vocabulary of ''loop'' can be introduced here: ''This is a loop —
            each thing feeds back into the other.'' Distinguish reinforcing loops (both things
            go up or both go down) from balancing loops (one going up brings the other down).'
        6-8:
          cognitiveModeLabel: Named regulatory mechanisms
          studentFacingDescription: Feedback loops are how systems regulate themselves — negative
            feedback keeps things stable, positive feedback amplifies change. I can identify
            which type is operating in a given system.
          classroomInstantiation: 'Analyzing social norm enforcement as a negative feedback
            loop: violations trigger punishment, punishment reduces violations, which maintains
            the norm; analyzing the cumulative culture ratchet as a positive feedback loop:
            better tools enable more learning, more learning produces better tools; analyzing
            primate stress hormones as a negative feedback loop: stress hormones trigger behavioral
            and physiological responses that reduce the stressor.'
          educatorBridgingNote: 'At 6–8, introduce the formal distinction between negative feedback
            (regulatory, stabilizing — output opposes the change that produced it) and positive
            feedback (amplifying, potentially runaway — output reinforces the change that produced
            it). Norm enforcement is an ideal negative feedback example because students can
            immediately understand its social function: it is a mechanism that prevents deviation
            from spreading. Cumulative culture is an ideal positive feedback example: each innovation
            enables more innovations.'
        9-12:
          cognitiveModeLabel: Coevolutionary dynamics formally modeled
          studentFacingDescription: Coevolution is a feedback process operating across two or
            more evolving systems — cultural evolution and genetic evolution can create feedback
            dynamics that neither system would produce alone.
          classroomInstantiation: 'Modeling gene-culture coevolution at the LCT locus: dairy
            farming (cultural) → lactase persistence selection (genetic) → expanded dairy nutrition
            (phenotypic) → further dairy farming adoption (cultural); modeling how social institutions
            coevolve with cultural norms in cooperative systems; using agent-based models to
            show how individual-level learning rules produce population-level cultural feedback
            dynamics.'
          educatorBridgingNote: 'At 9–12, feedback becomes the primary conceptual tool for understanding
            gene-culture coevolution — the signature process of human evolutionary history.
            Students should be able to specify the feedback loop in any coevolutionary system:
            what are the two (or more) evolving systems? What is the output of each that feeds
            back as input to the other? What timescale does each operate on? The timescale mismatch
            between cultural evolution (fast) and genetic evolution (slow) is particularly important:
            cultural practices can create selection pressures that persist long enough to produce
            genetic responses.'
      oe:accessibleInstantiations:
      - gradeBand: K-2
        example: When a grandmother teaches a tradition, her grandchild learns it and can teach
          it to their own children — the tradition keeps going because teaching creates more
          teaching.
      - gradeBand: 3-5
        example: A community that cooperates well can accomplish more together — and accomplishing
          more together makes cooperation more valuable — so cooperation feeds back to make
          itself more likely.
      - gradeBand: 6-8
        example: 'Social norms work through feedback: when someone breaks a rule, others punish
          them, which makes rule-breaking less common, which maintains the norm — a stabilizing
          feedback loop that keeps the community''s behavior in a certain range.'
      - gradeBand: 9-12
        example: 'Dairy farming created a positive feedback loop: communities that kept cattle
          had access to milk (a rich food), so individuals who could digest milk (lactase persistent)
          had higher fitness, so the lactase persistence allele spread, so more people could
          use dairy, so dairy farming became more valuable, so more cattle were kept — culture
          and genes coevolving in a self-amplifying loop.'
      oe:scopeNote: 'Feedback is the concept that most directly enables coevolutionary thinking
        — understanding that cause and effect are not always one-directional but can loop back
        on themselves. Gene-culture coevolution is the master example in evolutionary anthropology:
        cultural practices change the selective environment, which changes which genes spread,
        which changes cognitive and physical capacities, which changes cultural practices. By
        9-12, students should be able to identify feedback loops in any system they study and
        ask whether the feedback is stabilizing (negative feedback) or amplifying (positive
        feedback).'
  - id: OE-CONCEPT-000310
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Deep Time and Scale
    definitions:
      en:
        general: Humans exist within geological, evolutionary, and cultural timescales that
          dwarf individual lifespans. Students build intuitions for deep time across all strands.
    extensions:
      oe:conceptRole: cross-cutting-theme
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/framework/core/cct/deep-time
      oe:humanCodableIdentifier: CCT.DEEP-TIME
      oe:fullStatement: 'CROSS-CUTTING THEME 1 -- Deep Time and Scale: Humans exist within geological,
        evolutionary, and cultural timescales that dwarf individual lifespans. Students build
        intuitions for deep time across all strands, from personal family history (K-2) to molecular
        clocks and coalescent theory (9-12).'
      oe:strandActivation:
      - strandCode: HumOr
        activationNote: Primary strand -- geological and evolutionary timelines of hominin evolution
      - strandCode: DAG
        activationNote: Molecular clock inference; coalescent theory; population divergence
          dates
      - strandCode: EvoGen
        activationNote: Rates of molecular evolution; mutation accumulation across generations
      - strandCode: DLCE
        activationNote: Language family divergence times; deep history of oral traditions
    relations:
      skos:related:
      - OE-CONCEPT-000308
      - OE-CONCEPT-000101
      - OE-CONCEPT-000300
  - id: OE-CONCEPT-000311
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Variation and Universals
    definitions:
      en:
        general: Humans are simultaneously deeply similar and richly diverse. Students learn
          to hold both poles without collapsing diversity into a single norm or treating cultures
          as wholly incommensurable.
    extensions:
      oe:conceptRole: cross-cutting-theme
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/framework/core/cct/variation-universals
      oe:humanCodableIdentifier: CCT.VAR-UNIV
      oe:fullStatement: 'CROSS-CUTTING THEME 2 -- Variation and Universals: Humans are simultaneously
        deeply similar (shared biology, universal cognitive capacities, common needs) and richly
        diverse (cultural practices, languages, social structures, ecological adaptations).
        Students learn to hold both poles.'
      oe:strandActivation:
      - strandCode: HBEC
        activationNote: Primary strand -- cross-cultural behavioral ecology and cooperative
          diversity
      - strandCode: CCP
        activationNote: Primary strand -- WEIRD bias critique; cross-cultural cognitive development
      - strandCode: DLCE
        activationNote: Language and folklore diversity alongside linguistic universals
      - strandCode: DAG
        activationNote: Genetic population structure and diversity as biological backdrop to
          cultural diversity
      oe:sensitiveTopicFlags:
      - cultural-hierarchy-risk
      - indigenous-representation
      - WEIRD-bias
      oe:sensitiveTopicNote: Always present cultural diversity as multiple adaptive solutions
        to shared human challenges, not as stages of development or degrees of advancement.
    relations:
      skos:related:
      - OE-CONCEPT-000300
      - OE-CONCEPT-000307
      - OE-CONCEPT-000104
  - id: OE-CONCEPT-000312
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Evidence, Method, and Uncertainty
    definitions:
      en:
        general: Every claim about human evolution, behavior, and cognition rests on evidence
          gathered by specific methods with specific strengths and limits. Students develop
          progressively sophisticated understanding of scientific knowledge-making.
    extensions:
      oe:conceptRole: cross-cutting-theme
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/framework/core/cct/evid-method
      oe:humanCodableIdentifier: CCT.EVID-METHOD
      oe:fullStatement: 'CROSS-CUTTING THEME 3 -- Evidence, Method, and Uncertainty: Every claim
        about human evolution, behavior, and cognition rests on evidence gathered by specific
        methods with specific strengths and limits. Students develop progressively sophisticated
        understanding of how scientists know what they know -- and what remains genuinely unknown.'
      oe:strandActivation:
      - strandCode: HBEC
        activationNote: All strands -- universal activation
      - strandCode: HumOr
        activationNote: All strands -- universal activation
      - strandCode: DLCE
        activationNote: All strands -- universal activation
      - strandCode: DAG
        activationNote: All strands -- universal activation
      - strandCode: CCP
        activationNote: All strands -- universal activation
      - strandCode: EvoGen
        activationNote: All strands -- universal activation
      - strandCode: PrimEvo
        activationNote: All strands -- universal activation
    relations:
      skos:related:
      - OE-CONCEPT-000306
      - OE-CONCEPT-000304
      - OE-CONCEPT-000305
  - id: OE-CONCEPT-000313
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Human Place in Nature
    definitions:
      en:
        general: Humans are primates, mammals, and part of Earth's biosphere -- shaped by the
          same evolutionary forces as all life. Human uniqueness is real but relative, context-dependent,
          and a matter of degree.
    extensions:
      oe:conceptRole: cross-cutting-theme
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/framework/core/cct/place-in-nature
      oe:humanCodableIdentifier: CCT.PLACE-NATURE
      oe:fullStatement: 'CROSS-CUTTING THEME 4 -- Human Place in Nature: Humans are primates,
        mammals, and part of Earth''s biosphere -- shaped by the same evolutionary forces as
        all life. Human uniqueness is real but relative, context-dependent, and a matter of
        degree rather than categorical separation from the rest of nature.'
      oe:strandActivation:
      - strandCode: PrimEvo
        activationNote: Primary strand -- primate comparison grounds human place in the primate
          order
      - strandCode: HumOr
        activationNote: Hominin evolution shows continuous biological lineage from shared ancestor
      - strandCode: EvoGen
        activationNote: Genomic similarity between humans and other primates quantifies evolutionary
          relatedness
      - strandCode: HBEC
        activationNote: Human cooperation and culture analyzed using the same ecological frameworks
          applied to other species
      oe:sensitiveTopicFlags:
      - evolution-and-worldview
      oe:sensitiveTopicNote: This theme directly engages the 'humans as animals' framing that
        may conflict with some students' religious or cultural frameworks. Follow NSTA position
        statement on evolution.
    relations:
      skos:related:
      - OE-CONCEPT-000101
      - OE-CONCEPT-000104
      - OE-CONCEPT-000303
  - id: OE-CONCEPT-000314
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Origins of Science
    definitions:
      en:
        general: Science is a human cultural practice with a history, shaped by the same cognitive
          capacities and cultural transmission processes studied in this curriculum.
    extensions:
      oe:conceptRole: cross-cutting-theme
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/framework/core/cct/origins-of-science
      oe:humanCodableIdentifier: CCT.ORIGIN-SCI
      oe:fullStatement: 'CROSS-CUTTING THEME 5 -- Origins of Science: Science is a human cultural
        practice with a history, geography, and social structure -- shaped by the same cognitive
        capacities for learning, reasoning, and cumulative knowledge-building that are studied
        throughout this curriculum.'
      oe:strandActivation:
      - strandCode: HBEC
        activationNote: Science as cumulative culture -- the ratchet effect applied to knowledge
          production; scientific institutions as cooperative structures
      - strandCode: CCP
        activationNote: 'Primary activation -- cognitive foundations of science: theory of mind,
          causal reasoning, shared intentionality; WEIRD bias in research practice'
      oe:sensitiveTopicFlags:
      - scientific-racism-history
      - indigenous-knowledge
      - positionality-and-power
      oe:sensitiveTopicNote: The history of anthropology includes serious ethical violations,
        including scientific racism, eugenics, and the study of Indigenous communities without
        consent. These histories must be engaged honestly and directly at 9-12.
    relations:
      skos:related:
      - OE-CONCEPT-000101
      - OE-CONCEPT-000304
      - OE-CONCEPT-000307
      - OE-CONCEPT-000305
  - id: OE-CONCEPT-000315
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: EVA4K12-CONCEPTS-v1.0.0
    labels:
      en: Machine-Culture Coevolution
    definitions:
      en:
        general: Digital technologies and AI systems are now part of the cultural environment
          in which human cognition, learning, and social organization develop. Understanding
          this coevolution is increasingly essential for human self-understanding.
    extensions:
      oe:conceptRole: cross-cutting-theme
      oe:eva4k12SourceURI: https://eva4k12.openevo.net/framework/core/cct/machine-culture-coevolution
      oe:humanCodableIdentifier: CCT.MACH-CULT
      oe:fullStatement: 'CROSS-CUTTING THEME 6 -- Machine-Culture Coevolution: Digital technologies,
        algorithmic systems, and artificial intelligence are now deeply embedded in the cultural
        environments in which human cognition, learning, social organization, and knowledge
        production develop.'
      oe:strandActivation:
      - strandCode: HBEC
        activationNote: Primary strand -- machine-culture coevolution as an extension of cultural
          evolution theory; computational models of cultural transmission; social media as a
          new medium for conformity bias and prestige bias
      - strandCode: CCP
        activationNote: Primary strand -- how digital environments shape cognitive development;
          social media and learning biases; AI systems and theory of mind; human-AI social cognition
      oe:sensitiveTopicFlags:
      - AI-anxiety-and-student-wellbeing
      - digital-equity
      oe:sensitiveTopicNote: Some students may have significant anxiety about AI and automation.
        Frame engagement with these topics as developing understanding and agency, not amplifying
        fear. Be aware of significant digital equity differences.
    relations:
      skos:related:
      - OE-CONCEPT-000101
      - OE-CONCEPT-000309
      - OE-CONCEPT-000304
      - OE-CONCEPT-000307
      - OE-CONCEPT-000211
