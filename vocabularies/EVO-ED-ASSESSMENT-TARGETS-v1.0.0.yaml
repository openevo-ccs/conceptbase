# ============================================================================
# OpenEvo ConceptBase — Controlled Vocabulary: Evolution Education
# Assessment Targets (EVO-ED-ASSESSMENT-TARGETS)
# ============================================================================
# Path: /vocabularies/EVO-ED-ASSESSMENT-TARGETS-v1.0.0.yaml
#
# Operationalizes the assessment-target framework introduced in Nehm &
# Kampourakis (2022, Table 5, "Examples of possible assessment targets and
# associated learning objectives"): five targets — Nature of Science,
# Language of Science, Evolution Knowledge, Science Practices, and
# Cross-Cutting Concepts — each with several constituent performance
# objectives. Drafted per RFC-0014, in support of integrating Nehm &
# Kampourakis (2022) and Hanisch et al. (2026) more fully into the
# og:dispute:openevo-vs-kampourakis dispute graph (openevo-graph), whose
# central expert-reasoner-model divergence already cites this chapter via
# proposition:invariant-expert-reasoning (theorybase).
#
# NOT A TRANSCRIPTION, AND NOT A CLOSE PARAPHRASE (revised 2026-07-27,
# against the real source text). LiteratureBase's own independent
# classification of the source (literaturebase/records/nehm-2022.yaml)
# records `license: citation-only` -- no confirmed open-access/
# redistribution grant. The five top-level target `statement`s are
# generic pedagogical summaries (the same Disciplinary-Core-Ideas/
# Science-Practices/Cross-Cutting-Concepts three-dimensional-learning
# vocabulary NGSS itself uses), not present in Table 5 at all, and are
# fine. The 16 child objectives were ORIGINALLY drafted as close
# paraphrase of Table 5's actual wording (same clause structure/sequence,
# isolated synonym swaps only) -- checked directly against the real
# chapter text and found not sufficiently transformative to avoid
# substantial-similarity risk. Their `statement` fields now carry only a
# short topic label plus an explicit withholding note; the real
# learning-objective wording is deliberately NOT reproduced here.
# `citationOnly: true` (RFC-0005) is intentionally NOT set on any entry
# -- this is a non-CASE source (a book chapter), and citationOnly
# requires a CASE CFItem UUID/URI this source has none of, the same gap
# RFC-0011 already surfaced for DigCompEdu/KMK.
#
# License: unconfirmed for the underlying assessment-target framework
# (source classified citation-only); this vocabulary's own topic labels
# are OECB content under the standard CC-BY-NC-SA-4.0 (RFC-0004),
# flagged for maintainer/licensing review before any proposed -> accepted
# promotion -- see RFC-0014.
#
# Structure: 2-level hierarchy via skos:broader -- 5 Assessment-Target
# entries (top level) -> 16 Performance-Objective entries, each
# skos:broader -> its target. humanCodingScheme uses "{Target letter}
# {objective number}", e.g. "A1", mirroring CCC-v1.0.0.yaml's convention.
# ============================================================================

meta:
  id: EVO-ED-ASSESSMENT-TARGETS
  version: 1.0.0
  status: proposed
  scope: >
    Evolution-education assessment targets: 5 targets (Nature of Science,
    Language of Science, Evolution Knowledge, Science Practices,
    Cross-Cutting Concepts), 16 constituent performance objectives,
    operationalizing the assessment-target framework from Nehm &
    Kampourakis (2022) Table 5 for use alongside the
    og:dispute:openevo-vs-kampourakis dispute graph and the two reference
    LPMs (bio-core-k12, oe-interdisciplinary-k12).
  discipline: evolutionary-biology-education
  license: >-
    Unconfirmed for the underlying source framework (literaturebase
    classifies Nehm & Kampourakis 2022 as citation-only); this
    vocabulary's own paraphrased expression is CC-BY-NC-SA-4.0. See
    RFC-0014's Licensing section -- flagged for maintainer review before
    proposed -> accepted promotion.
  authors:
    - name: OpenEvo ConceptBase Maintainers
  conformsTo: OE-SCHEMA-COMPETENCY-v1.1.0
  phase: 1

