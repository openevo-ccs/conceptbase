# ============================================================================
# OpenEvo ConceptBase -- Controlled Vocabulary: OPENEVO-DESIGN-CONCEPT
# ============================================================================
# Path: /vocabularies/OPENEVO-DESIGN-CONCEPT-v1.0.0.yaml
#
# The 9 OpenEvo content anchors (Ancient Ancestors, Cross-species
# Comparisons, Child Development, Cooperation Games, Cultural Diversity,
# Governing the Commons, Our Mind, Computer Models, Global Sustainability
# Goals) -- the foundational disciplinary entry points OpenEvo's
# curriculum-design concept is organized around. Migrated per RFC-0023
# from openevo-graph/nodes/content_anchors.json, the only prior
# machine-readable copy of this vocabulary and now a generated mirror of
# this file. Generated by scripts/migrate_content_anchors.py -- do not
# hand-edit content sourced from there without also updating the source
# JSON for provenance consistency.
#
# Each anchor is a tagged oe:Concept (extensions["oe:conceptRole"] =
# "content-anchor"), not a new ontology class -- see RFC-0023 "Standards
# justification". Grade-band progressions (K-2 through 13-16) have no
# matching schema field and are carried losslessly via
# extensions["oe:developmentalArc"], the same field name and pattern
# RFC-0012 established for eva4k12's own developmental-arc content.
#
# The 6 OpenEvo thinking tools are NOT part of this vocabulary -- they
# already have a governed home as oe:Method records in MethodsBase
# (methodsbase/records/methods.yaml, OE-METHOD-tinbergens-questions and
# five siblings, added 2026-09-02). See RFC-0023 "Motivation".
#
# CASE-standard crosswalk data (NGSS/C3/IB MYP/etc. alignments) is
# deliberately not migrated here -- see RFC-0023 "Deferred". It stays in
# openevo-graph/nodes/content_anchors.json until a later RFC gives it a
# ConceptBase home (Phase 2 alignments).
#
# relatedAnchors is carried through exactly as authored -- every anchor has
# exactly 3, a deliberate curation, not always reciprocal. This intentionally
# does NOT satisfy scripts/check_related_symmetry.py's symmetry expectation;
# that check is advisory (not run in CI, see .github/workflows/validate.yml),
# and forcing symmetry here would override the source's own top-3 curation.
# See RFC-0023 "Proposed change".
# ============================================================================

meta:
  id: OPENEVO-DESIGN-CONCEPT
  version: 1.0.0
  status: proposed
  scope: >
    The 9 content anchors of OpenEvo's educational design concept --
    the foundational, cross-disciplinary phenomenological entry points
    (alongside the 3 design principles and 6 thinking tools, the latter
    governed separately in MethodsBase) that OpenEvo curriculum design is
    organized around.
  discipline: interdisciplinary
  license: CC-BY-NC-SA-4.0
  authors:
    - name: OpenEvo ConceptBase Maintainers
  conformsTo: OE-SCHEMA-CONCEPT-v1.2.0
  phase: 1

concepts:
  - id: OE-CONCEPT-openevo-design-concept-ancient-ancestors
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Ancient Ancestors
    definitions:
      en:
        general: Human biological and cultural traits are the product of millions of years of
          evolutionary history, readable through fossil records, archaeological evidence, and
          comparative studies of living species.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-cross-species-comparisons
      - OE-CONCEPT-openevo-design-concept-cultural-diversity
      - OE-CONCEPT-openevo-design-concept-our-mind
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Paleoanthropology / Evolutionary Biology / Archaeology
      oe:subjectAreas:
      - Science
      - Social Studies
      - History
      - Humanities
      - Cross-Disciplinary
      oe:developmentalArc:
        K-2: Stories of early humans and ancient life. Basic timelines and the idea that humans
          have ancient origins. Exploration of tools and artefacts.
        3-5: Introduction to fossil evidence, early human species, and basic evolutionary concepts.
          Comparison of human and non-human primate anatomy.
        6-8: Hominin evolution, key fossil discoveries, and the emergence of language, art,
          and social complexity. Archaeological inquiry methods.
        9-12: Advanced paleoanthropology, genetic evidence for human origins, multiregional
          vs. out-of-Africa models, and deep cultural history.
        13-16: Original research engagement with paleoanthropological literature, ancient DNA
          analysis, and theoretical frameworks for human evolution.
      oe:fullDescription: Ancient Ancestors anchors learning in the deep evolutionary and cultural
        history of the human lineage. Students engage with paleoanthropological evidence, archaeological
        records, and comparative anatomy to explore what it means to be human across time. This
        anchor foregrounds questions of biological and cultural continuity, the emergence of
        language, tool use, symbolic behaviour, and social complexity. It provides a foundational
        lens for understanding human nature as the product of deep evolutionary processes, connecting
        natural science, social science, and humanities in a sustained inquiry into human origins.
      oe:tags:
      - evolution
      - paleoanthropology
      - human-origins
      - archaeology
      - deep-history
      - hominins
      - fossil-evidence
      oe:curatorNote: Primary anchor for connecting biological evolution (NGSS) with human cultural
        history (C3, IB). Strong bridge between science and humanities curriculum areas.
  - id: OE-CONCEPT-openevo-design-concept-cross-species-comparisons
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Cross-species Comparisons
    definitions:
      en:
        general: Systematic comparison of behaviour, cognition, and biology across species reveals
          both shared evolutionary heritage and the distinctive features of human and non-human
          animal minds.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-ancient-ancestors
      - OE-CONCEPT-openevo-design-concept-our-mind
      - OE-CONCEPT-openevo-design-concept-child-development
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Comparative Psychology / Ethology / Evolutionary Biology
      oe:subjectAreas:
      - Science
      - Cross-Disciplinary
      - Philosophy
      oe:developmentalArc:
        K-2: Observation of animal behaviour and basic comparisons between humans and familiar
          animals. What do animals do? What can they learn?
        3-5: Structured comparison of animal cognition — tool use, communication, social behaviour.
          Introduction to the concept of adaptation.
        6-8: Comparative cognition studies, ethological methods, and the logic of the comparative
          method. Homology vs. analogy.
        9-12: Advanced comparative psychology, primate cognition research, animal communication
          systems, and evolutionary explanations of behaviour.
        13-16: Engagement with primary ethological and comparative psychology literature. Research
          design in comparative cognition.
      oe:fullDescription: Cross-species Comparisons anchors learning in the comparative study
        of cognition, behaviour, social organisation, and biology across animal species. Students
        engage with ethological research, comparative psychology, and evolutionary biology to
        examine what humans share with other animals and what distinguishes us. This anchor
        develops scientific reasoning through the logic of comparative method, introduces concepts
        of homology and analogy, and provides empirical grounding for understanding the evolutionary
        origins of human capacities including language, cooperation, tool use, and culture.
        It bridges life science, psychology, and philosophy of mind.
      oe:tags:
      - comparative-cognition
      - ethology
      - animal-behaviour
      - evolution
      - primate-cognition
      - comparative-method
      - tool-use
      oe:curatorNote: Central anchor for connecting evolutionary biology with cognitive science
        and comparative psychology. Strong alignment with NGSS life science and IB science frameworks.
  - id: OE-CONCEPT-openevo-design-concept-child-development
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Child Development
    definitions:
      en:
        general: Human cognitive, social, emotional, and linguistic capacities develop through
          a dynamic interplay of biological maturation, social interaction, and cultural learning
          across childhood and adolescence.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-our-mind
      - OE-CONCEPT-openevo-design-concept-cross-species-comparisons
      - OE-CONCEPT-openevo-design-concept-ancient-ancestors
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Developmental Psychology / Educational Neuroscience / Cognitive Science
      oe:subjectAreas:
      - Science
      - Humanities
      - Cross-Disciplinary
      - Health
      - Philosophy
      oe:developmentalArc:
        K-2: Basic awareness of how babies and children grow and learn. Stories about learning
          and development. Introduction to emotions and social understanding.
        3-5: Stages of development, brain basics, and how learning happens. Piaget's concrete
          operations introduced through hands-on investigation.
        6-8: Adolescent brain development, theory of mind, language acquisition, and social
          cognition. Metacognitive awareness as a learning tool.
        9-12: Advanced developmental psychology, Vygotsky and zone of proximal development,
          moral development, and identity formation in adolescence.
        13-16: Developmental neuroscience, attachment theory, research methods in developmental
          psychology, and applications in education and policy.
      oe:fullDescription: Child Development anchors learning in the study of how humans grow,
        learn, and develop from infancy through adolescence. Students engage with developmental
        psychology, neuroscience, and education research to understand cognitive, social, emotional,
        and linguistic development. This anchor illuminates the processes through which humans
        acquire language, theory of mind, moral reasoning, and social competence — providing
        both a scientific account of human development and a reflective lens on students' own
        learning. It connects life science, psychology, social studies, and philosophy of mind,
        and grounds curriculum design in an understanding of age-appropriate learning progressions.
      oe:tags:
      - developmental-psychology
      - cognitive-development
      - language-acquisition
      - theory-of-mind
      - adolescence
      - neuroscience
      - piaget
      - vygotsky
      oe:curatorNote: Anchor with strong metacognitive potential — students can apply developmental
        concepts to understanding their own learning. Key bridge between science and educational
        practice.
  - id: OE-CONCEPT-openevo-design-concept-cooperation-games
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Cooperation Games
    definitions:
      en:
        general: Cooperation between individuals and groups is a fundamental feature of human
          and non-human societies, explainable through evolutionary, mathematical, and social
          scientific frameworks that reveal when and why cooperation succeeds or fails.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-governing-the-commons
      - OE-CONCEPT-openevo-design-concept-cultural-diversity
      - OE-CONCEPT-openevo-design-concept-global-sustainability-goals
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Game Theory / Evolutionary Biology / Behavioural Economics / Political
        Science
      oe:subjectAreas:
      - Mathematics
      - Science
      - Social Studies
      - Philosophy
      - Cross-Disciplinary
      oe:developmentalArc:
        K-2: Cooperative play and games. Why sharing matters. Stories about helping and working
          together. Simple team challenges.
        3-5: Introduction to cooperation and competition through structured games. Basic concepts
          of fairness, rules, and collective outcomes.
        6-8: Prisoner's Dilemma and public goods games. Evolutionary explanations of cooperation.
          Real-world collective action problems.
        9-12: Game theory, Nash equilibrium, evolutionary game theory, and institutional economics.
          Applications to political science and environmental policy.
        13-16: Advanced game theory, mechanism design, experimental economics, and the mathematics
          of evolutionary cooperation models.
      oe:fullDescription: Cooperation Games anchors learning in the study of cooperation, collective
        action, and strategic interaction using game-theoretic frameworks. Students engage with
        the mathematics of decision-making, evolutionary accounts of altruism and cooperation,
        and social scientific evidence for how humans coordinate and sustain collective action.
        Key phenomena include the Prisoner's Dilemma, public goods games, and real-world cooperation
        problems. This anchor provides a rigorous cross-disciplinary lens connecting mathematics,
        evolutionary biology, economics, political science, and ethics — illuminating the conditions
        under which cooperation emerges, is sustained, and breaks down in human and non-human
        societies.
      oe:tags:
      - game-theory
      - cooperation
      - collective-action
      - prisoners-dilemma
      - evolutionary-biology
      - behavioural-economics
      - altruism
      - public-goods
      oe:curatorNote: Highly cross-disciplinary anchor. Connects mathematics (probability, game
        theory) with evolutionary biology, economics, and political philosophy. Excellent for
        problem-based learning designs.
  - id: OE-CONCEPT-openevo-design-concept-cultural-diversity
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Cultural Diversity
    definitions:
      en:
        general: Human cultures display profound diversity in values, practices, beliefs, and
          social organisation. This diversity is both a product of cultural evolution and a
          window into the range of human potential, challenging assumptions about universal
          or natural forms of human life.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-ancient-ancestors
      - OE-CONCEPT-openevo-design-concept-governing-the-commons
      - OE-CONCEPT-openevo-design-concept-global-sustainability-goals
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Cultural Anthropology / Cross-Cultural Psychology / Cultural Evolution
      oe:subjectAreas:
      - Social Studies
      - Humanities
      - History
      - Cross-Disciplinary
      - World Languages
      oe:developmentalArc:
        K-2: Celebrating differences in food, family, celebrations, and daily life. Stories
          from diverse cultural perspectives.
        3-5: Systematic comparison of cultural practices across regions. Introduction to cultural
          relativism and ethnocentrism.
        6-8: Cross-cultural psychology, cultural norms and values, and the concept of cultural
          evolution. Fieldwork and ethnographic methods introduced.
        9-12: Advanced cultural anthropology, cultural transmission models, and theoretical
          debates about cultural universals and relativism.
        13-16: Engagement with cultural evolution literature, cross-cultural research methods,
          and the anthropology of cognition and culture.
      oe:fullDescription: Cultural Diversity anchors learning in the empirical and theoretical
        study of human cultural variation across time and space. Students engage with anthropological
        fieldwork, cross-cultural psychology, cultural evolution research, and comparative cultural
        studies to understand why human cultures differ, how cultural practices emerge and spread,
        and what cultural diversity reveals about human nature and human potential. This anchor
        challenges ethnocentrism, develops intercultural competence, and raises fundamental
        questions about universals and particulars in human experience. It connects social science,
        humanities, and evolutionary biology through the lens of cultural learning and transmission.
      oe:tags:
      - cultural-anthropology
      - cross-cultural
      - cultural-evolution
      - intercultural-competence
      - ethnography
      - cultural-relativism
      - human-diversity
      oe:curatorNote: Broadest cross-disciplinary anchor. Essential bridge between science (cultural
        evolution) and humanities (cultural studies, ethics). Strong alignment with IB global
        contexts and P21 global awareness.
  - id: OE-CONCEPT-openevo-design-concept-governing-the-commons
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Governing the Commons
    definitions:
      en:
        general: Human communities have developed diverse institutional arrangements for governing
          shared resources — from local fishing grounds to global digital commons — that reveal
          the conditions under which self-governance succeeds and the design principles that
          make institutions robust.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-cooperation-games
      - OE-CONCEPT-openevo-design-concept-global-sustainability-goals
      - OE-CONCEPT-openevo-design-concept-computer-models
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Political Science / Institutional Economics / Environmental Science / Governance
        Studies
      oe:subjectAreas:
      - Social Studies
      - Science
      - Mathematics
      - Philosophy
      - Cross-Disciplinary
      oe:developmentalArc:
        K-2: Shared spaces and resources in the classroom and community. Rules for taking care
          of things we all use.
        3-5: Community resources and local governance. Introduction to rules, norms, and collective
          decision-making. Case studies of local commons.
        6-8: Ostrom's design principles. Case studies of fishing commons, forests, and irrigation
          systems. Comparison with top-down governance models.
        9-12: Advanced institutional economics, polycentric governance, the global commons (atmosphere,
          oceans), and digital commons. Policy analysis.
        13-16: Engagement with Ostrom's primary literature, commons theory, and original analysis
          of governance institutions and their design.
      oe:fullDescription: Governing the Commons anchors learning in Elinor Ostrom's foundational
        research on collective governance of shared resources, and the broader literature on
        commons management, institutional design, and polycentric governance. Students engage
        with real-world case studies of fishing grounds, forests, irrigation systems, and digital
        commons to understand how communities develop rules, norms, and institutions to manage
        shared resources sustainably. This anchor connects political science, economics, environmental
        science, and ethics, and provides a powerful empirical counterpoint to the 'tragedy
        of the commons' narrative. It develops systems thinking, institutional analysis, and
        civic reasoning.
      oe:tags:
      - commons
      - ostrom
      - governance
      - institutions
      - collective-action
      - sustainability
      - polycentric
      - civic-reasoning
      oe:curatorNote: Built around Nobel laureate Elinor Ostrom's work. Excellent anchor for
        connecting civic reasoning, environmental science, and institutional economics. Strong
        SDG and global sustainability connections.
  - id: OE-CONCEPT-openevo-design-concept-our-mind
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Our Mind
    definitions:
      en:
        general: The human mind is a biological system shaped by evolution, development, and
          culture, with characteristic strengths and systematic limitations that are illuminated
          by cognitive science, neuroscience, and philosophy of mind.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-child-development
      - OE-CONCEPT-openevo-design-concept-cross-species-comparisons
      - OE-CONCEPT-openevo-design-concept-computer-models
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Cognitive Science / Neuroscience / Psychology / Philosophy of Mind
      oe:subjectAreas:
      - Science
      - Philosophy
      - Humanities
      - Cross-Disciplinary
      - Health
      oe:developmentalArc:
        K-2: Basic awareness of thinking, feeling, and learning. Emotions and how they affect
          behaviour. The brain as the organ of thinking.
        3-5: Memory, attention, and basic cognitive processes. Introduction to cognitive biases
          through relatable examples. Growth mindset framing.
        6-8: Dual-process thinking (System 1 / System 2), cognitive biases, and metacognition
          as a learning tool. Introduction to neuroscience basics.
        9-12: Advanced cognitive psychology, consciousness, philosophy of mind, neuroscience
          of learning, and critical evaluation of cognitive claims.
        13-16: Cognitive science research methods, philosophy of mind, consciousness studies,
          and applications in education, law, and public policy.
      oe:fullDescription: 'Our Mind anchors learning in the scientific and philosophical study
        of the human mind — perception, attention, memory, reasoning, emotion, consciousness,
        and metacognition. Students engage with cognitive science, neuroscience, philosophy
        of mind, and psychology to build an empirically grounded understanding of how human
        minds work, where they are reliable, and where they are systematically biased. This
        anchor has profound metacognitive implications: students who understand cognitive biases,
        memory limitations, and dual-process reasoning become better learners and thinkers.
        It connects biology, psychology, philosophy, and education across all grade levels.'
      oe:tags:
      - cognitive-science
      - neuroscience
      - metacognition
      - cognitive-bias
      - philosophy-of-mind
      - dual-process
      - memory
      - consciousness
      oe:curatorNote: The anchor with the most direct metacognitive payoff for learners. Understanding
        Our Mind is simultaneously a content anchor and a meta-level tool for improving learning
        across all other anchors.
  - id: OE-CONCEPT-openevo-design-concept-computer-models
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Computer Models
    definitions:
      en:
        general: Computational models and simulations allow us to explore the behaviour of complex
          systems — from evolutionary dynamics to climate systems to social networks — providing
          scientific insight that cannot be obtained through traditional observation or experiment
          alone.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-governing-the-commons
      - OE-CONCEPT-openevo-design-concept-global-sustainability-goals
      - OE-CONCEPT-openevo-design-concept-cooperation-games
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Computational Science / Systems Science / Mathematics / Computer Science
      oe:subjectAreas:
      - Computer Science
      - Mathematics
      - Science
      - Cross-Disciplinary
      - Social Studies
      oe:developmentalArc:
        K-2: Simple simulations and interactive models as exploration tools. 'What happens if...?'
          investigation through guided digital play.
        3-5: Using pre-built simulations to explore science and social science phenomena. Introduction
          to variables and model parameters.
        6-8: Agent-based modelling with tools like NetLogo. Building and modifying simple models.
          Critiquing model assumptions.
        9-12: Advanced agent-based modelling, system dynamics, and statistical modelling. Model
          validation and the epistemology of simulation.
        13-16: Research-grade computational modelling, machine learning concepts, and original
          simulation-based research projects.
      oe:fullDescription: Computer Models anchors learning in the use of computational modelling
        and simulation as tools for understanding complex systems in science, social science,
        mathematics, and the humanities. Students engage with agent-based models, system dynamics
        simulations, and data visualisation tools to explore phenomena that are too complex,
        too slow, too fast, or too dangerous to study directly. This anchor develops computational
        thinking as a genuine scientific and humanistic tool — not merely a programming skill
        — and connects mathematics, science, and social science through the common practice
        of building, running, interpreting, and critiquing models of real-world systems.
      oe:tags:
      - computational-modelling
      - agent-based-models
      - simulation
      - systems-thinking
      - netlogo
      - complex-systems
      - computational-thinking
      - data-visualisation
      oe:curatorNote: Highest computational thinking intensity of all anchors. Designed to position
        modelling as a genuine scientific practice rather than a technical skill. NetLogo and
        similar tools provide accessible entry points at 6-8 level.
  - id: OE-CONCEPT-openevo-design-concept-global-sustainability-goals
    type: oe:Concept
    status: proposed
    version: 1.0.0
    definedInVocabulary: OPENEVO-DESIGN-CONCEPT-v1.0.0
    labels:
      en: Global Sustainability Goals
    definitions:
      en:
        general: The 17 UN Sustainable Development Goals define humanity's most pressing collective
          challenges — from climate change to inequality to biodiversity loss — requiring integrated
          scientific understanding, cross-cultural cooperation, and innovative governance for
          their achievement.
    relations:
      skos:related:
      - OE-CONCEPT-openevo-design-concept-governing-the-commons
      - OE-CONCEPT-openevo-design-concept-computer-models
      - OE-CONCEPT-openevo-design-concept-cooperation-games
    extensions:
      oe:conceptRole: content-anchor
      oe:discipline: Sustainability Science / Environmental Science / Political Science / Ethics
      oe:subjectAreas:
      - Science
      - Social Studies
      - Geography
      - Cross-Disciplinary
      - Philosophy
      - Health
      oe:developmentalArc:
        K-2: Taking care of our world — local environmental stewardship and community wellbeing.
          Introduction to the idea that our actions affect others and the planet.
        3-5: Introduction to specific SDGs through concrete examples — clean water, food security,
          biodiversity. Local-to-global connections.
        6-8: Systems analysis of specific SDGs. Trade-offs between goals. Introduction to climate
          science, biodiversity, and global inequality.
        9-12: Advanced sustainability science, climate policy, international development, and
          ethical dimensions of global sustainability challenges.
        13-16: Research-level engagement with sustainability science, original analysis of SDG
          progress, and policy design for sustainable development.
      oe:fullDescription: Global Sustainability Goals anchors learning in the UN Sustainable
        Development Goals and the broader scientific, social, and ethical dimensions of sustainability
        challenges facing humanity in the 21st century. Students engage with climate science,
        biodiversity, poverty, inequality, health, and governance to understand sustainability
        as a complex systems challenge requiring cross-disciplinary understanding and collective
        action. This anchor provides the most direct connection between OpenEvo curriculum content
        and real-world civic action, motivating students to apply thinking tools and competencies
        from across the curriculum to genuine planetary-scale problems. It connects science,
        social science, ethics, and civic engagement.
      oe:tags:
      - sdgs
      - sustainability
      - climate
      - biodiversity
      - global-citizenship
      - environmental-science
      - civic-action
      - esd
      oe:curatorNote: Most directly civic and action-oriented anchor. Connects to UN SDGs as
        primary CASE framework. Designed to motivate real-world application of all other OpenEvo
        anchors and thinking tools.
