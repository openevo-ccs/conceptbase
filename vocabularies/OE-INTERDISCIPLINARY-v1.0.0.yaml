        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-emergence
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Emergence
    definitions:
      en:
        general: 'Patterns in the whole that arise from the interactions of the parts, with
          no part or leader planning them. Wording for students: Something happens at the group
          level that no single member decided.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-decentralized-causal-reasoning
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-emergence
