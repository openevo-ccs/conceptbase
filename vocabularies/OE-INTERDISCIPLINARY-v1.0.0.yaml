  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-non-linear-change
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Non-Linear Change
    definitions:
      en:
        general: 'Complexity scientists often say that in complex systems there are nonlinear
          dynamics. This means that two systems that are almost the same or only differ in small
          ways initially, can change in dramatically different ways.

          '
    extensions:
