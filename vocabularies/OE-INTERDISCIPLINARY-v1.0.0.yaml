# ============================================================================
# OpenEvo ConceptBase — Controlled Vocabulary: OE-INTERDISCIPLINARY
# ============================================================================
# Path: /vocabularies/OE-INTERDISCIPLINARY-v1.0.0.yaml
#
# Interdisciplinary vocabulary spanning biological and cultural evolution,
# development, cognition, and technology (see Spec v0.2, "OpenEvo
# Vocabulary"). Each entry under `concepts:` validates against
# /schemas/concept.schema.yaml.
#
# Design intent: concepts here are framed generically enough that a
# biological mechanism (e.g. gene-based inheritance) is treated as ONE
# instance of a more general process (e.g. Inheritance) rather than the
# defining case. Where a term's meaning genuinely differs by discipline
# (flagged in Spec v0.2's disambiguation example — "Selection"), multiple
# discipline keys are populated under `definitions.en`. Where a single
# cross-domain framing already suffices, one `general` key is used instead
# of manufacturing artificial distinctions.
#
# IDs OE-CONCEPT-oe-interdisciplinary-evolutionary-process,
# OE-CONCEPT-oe-interdisciplinary-selection, and OE-CONCEPT-oe-interdisciplinary-variation
# intentionally match the
# identifiers already referenced as illustrative examples in
# /schemas/concept.schema.yaml and the ConceptBase spec itself
# ("Evolutionary Process", "Selection", "Variation"), so those earlier
# examples resolve to real entries rather than being orphaned.
#
# Cross-vocabulary alignment to BIO-CORE (e.g. this file's `Selection`
# <-> BIO-CORE's `Natural Selection`) is deliberately NOT asserted here;
# it belongs in /alignments/ with its own provenance record (Phase 2).
# ============================================================================

meta:
  id: OE-INTERDISCIPLINARY
  version: 1.0.0
  status: stable
  scope: >
    Interdisciplinary vocabulary unifying biological evolution, cultural
    evolution, human development, cognition, and technology under shared
    general-process concepts.
  discipline: interdisciplinary
  license: CC-BY-NC-SA-4.0
  authors:
    - name: OpenEvo ConceptBase Maintainers
  conformsTo: OE-SCHEMA-CONCEPT-v1.0.0
  phase: 1

concepts:

  - id: OE-CONCEPT-oe-interdisciplinary-evolutionary-process
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Evolutionary Process
    definitions:
      en:
        general: >
          Any process by which variants are generated, selected, and
          transmitted across iterations within a system — applicable to
          genetic, cultural, technological, or cognitive systems alike.
    relations:
      skos:narrower:
        - OE-CONCEPT-oe-interdisciplinary-inheritance  # Inheritance
        - OE-CONCEPT-oe-interdisciplinary-selection  # Selection
        - OE-CONCEPT-oe-interdisciplinary-variation  # Variation
        - OE-CONCEPT-oe-interdisciplinary-transmission  # Transmission
        - OE-CONCEPT-oe-interdisciplinary-innovation  # Innovation
        - OE-CONCEPT-oe-interdisciplinary-development  # Development
      skos:related: [OE-CONCEPT-oe-interdisciplinary-niche-construction, OE-SANDBOX-CONCEPT-oe-interdisciplinary-restructuration]

  - id: OE-CONCEPT-oe-interdisciplinary-inheritance
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Inheritance
    definitions:
      en:
        biology: Transmission of genetic information from parent to offspring.
        culture: >
          Transmission of beliefs, practices, or knowledge from one
          generation, or one individual, to another via social learning.
        technology: >
          Persistence of design features or code structure across
          successive versions of an artifact or system.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related: [OE-CONCEPT-oe-interdisciplinary-transmission, OE-CONCEPT-oe-interdisciplinary-variation]
    examples:
      - A gene passed from parent to offspring.
      - A recipe passed down through a family across generations.
      - A software library's API conventions persisting across major versions.

  - id: OE-CONCEPT-oe-interdisciplinary-transmission
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Transmission
    definitions:
      en:
        general: >
          The process by which information, traits, or practices move
          from one holder (organism, person, group, or system) to
          another.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related: [OE-CONCEPT-oe-interdisciplinary-inheritance, OE-CONCEPT-oe-interdisciplinary-teaching, OE-CONCEPT-oe-interdisciplinary-communication, OE-SANDBOX-CONCEPT-oe-interdisciplinary-language-evolution]

  - id: OE-CONCEPT-oe-interdisciplinary-innovation
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Innovation
    definitions:
      en:
        general: >
          The generation of a novel variant — an idea, practice,
          technology, or trait — that did not previously exist within a
          system.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related: [OE-CONCEPT-oe-interdisciplinary-representation, OE-CONCEPT-oe-interdisciplinary-technology, OE-CONCEPT-oe-interdisciplinary-norms, OE-SANDBOX-CONCEPT-oe-interdisciplinary-language-evolution, OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning]

  - id: OE-CONCEPT-oe-interdisciplinary-information
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Information
    definitions:
      en:
        general: >
          A pattern or signal that reduces uncertainty for a receiver,
          whether encoded genetically, linguistically, symbolically, or
          computationally.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-representation, OE-CONCEPT-oe-interdisciplinary-communication, OE-CONCEPT-oe-interdisciplinary-norms, OE-CONCEPT-oe-interdisciplinary-knowledge]

  - id: OE-CONCEPT-oe-interdisciplinary-representation
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Representation
    definitions:
      en:
        general: >
          A structure — mental, symbolic, or computational — that
          stands for and conveys meaning about something else.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-information, OE-CONCEPT-oe-interdisciplinary-norms, OE-CONCEPT-oe-interdisciplinary-innovation]

  - id: OE-CONCEPT-oe-interdisciplinary-cooperation
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Cooperation
    definitions:
      en:
        general: >
          Coordinated behavior among individuals or groups that produces
          a mutual benefit not achievable, or less efficiently achieved,
          alone.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-conflict, OE-CONCEPT-oe-interdisciplinary-culture, OE-CONCEPT-oe-interdisciplinary-institutions, OE-SANDBOX-CONCEPT-oe-interdisciplinary-agent-based-modeling]

  - id: OE-CONCEPT-oe-interdisciplinary-conflict
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Conflict
    definitions:
      en:
        general: >
          Competing interests, goals, or behaviors among individuals or
          groups within a shared system or environment.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-cooperation]

  - id: OE-CONCEPT-oe-interdisciplinary-niche-construction
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Niche Construction
    definitions:
      en:
        general: >
          The process by which organisms or groups modify their
          environment in ways that alter the selective pressures acting
          on themselves or others.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process, OE-CONCEPT-oe-interdisciplinary-development, OE-CONCEPT-oe-interdisciplinary-technology, OE-CONCEPT-oe-interdisciplinary-selection]

  - id: OE-CONCEPT-oe-interdisciplinary-development
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Development
    definitions:
      en:
        biology: >
          The process by which an organism grows and matures from an
          initial state toward greater complexity or capability.
        education: >
          The progressive growth of a learner's knowledge, skills, or
          competencies over time, often scaffolded by instruction.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related: [OE-CONCEPT-oe-interdisciplinary-agency, OE-CONCEPT-oe-interdisciplinary-scaffolding, OE-CONCEPT-oe-interdisciplinary-learning, OE-CONCEPT-oe-interdisciplinary-niche-construction]

  - id: OE-CONCEPT-oe-interdisciplinary-agency
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Agency
    definitions:
      en:
        general: >
          The capacity of an individual or system to act intentionally
          and make choices that influence outcomes, rather than
          responding passively to external forces.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-development, OE-CONCEPT-oe-interdisciplinary-scaffolding, OE-CONCEPT-oe-interdisciplinary-selection, OE-SANDBOX-CONCEPT-oe-interdisciplinary-comparative-cognition, OE-SANDBOX-CONCEPT-oe-interdisciplinary-decentralized-causal-reasoning, OE-SANDBOX-CONCEPT-oe-interdisciplinary-agent-based-modeling, OE-SANDBOX-CONCEPT-oe-interdisciplinary-theory-of-mind]

  - id: OE-CONCEPT-oe-interdisciplinary-scaffolding
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Scaffolding
    definitions:
      en:
        education: >
          Temporary structured support provided to a learner, gradually
          withdrawn as competence increases.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-development, OE-CONCEPT-oe-interdisciplinary-learning, OE-CONCEPT-oe-interdisciplinary-teaching, OE-CONCEPT-oe-interdisciplinary-agency]

  - id: OE-CONCEPT-oe-interdisciplinary-selection
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Selection
    aliases:
      en: [Selective Process]
    definitions:
      en:
        biology: Differential reproductive success among heritable variants.
        culture: >
          Differential persistence or spread of cultural variants —
          ideas, practices, or artifacts — based on their fit to a
          social or environmental context.
        education: Choosing among available instructional pathways or resources.
        ai: >
          A search or optimization process that favors candidates
          scoring higher against an objective function.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related: [OE-CONCEPT-oe-interdisciplinary-variation, OE-CONCEPT-oe-interdisciplinary-niche-construction, OE-CONCEPT-oe-interdisciplinary-agency, OE-SANDBOX-CONCEPT-oe-interdisciplinary-machine-culture, OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning]
    examples:
      - A cultural practice being adopted more widely because it improves group cohesion.
      - A genetic algorithm retaining higher-fitness candidate solutions across generations.
    nonExamples:
      - The random generation of a new variant (see Variation, Innovation).
    citations:
      - text: >
          Mesoudi, A. (2011). Cultural Evolution: How Darwinian Theory
          Can Explain Human Culture and Synthesize the Social Sciences.

  - id: OE-CONCEPT-oe-interdisciplinary-variation
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Variation
    definitions:
      en:
        general: >
          The existence of differences among individuals, variants, or
          instances within a population or system, providing the raw
          material on which selection can act.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related: [OE-CONCEPT-oe-interdisciplinary-selection, OE-CONCEPT-oe-interdisciplinary-inheritance, OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning]

  - id: OE-CONCEPT-oe-interdisciplinary-learning
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Learning
    definitions:
      en:
        general: >
          A relatively durable change in knowledge, behavior, or
          capability resulting from experience, instruction, or
          practice.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-scaffolding, OE-CONCEPT-oe-interdisciplinary-teaching, OE-CONCEPT-oe-interdisciplinary-development, OE-SANDBOX-CONCEPT-oe-interdisciplinary-comparative-cognition, OE-SANDBOX-CONCEPT-oe-interdisciplinary-hybrid-social-learning]

  - id: OE-CONCEPT-oe-interdisciplinary-teaching
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Teaching
    definitions:
      en:
        general: >
          Intentional action by one individual or system to facilitate
          another's learning or transmission of a skill, practice, or
          piece of knowledge.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-learning, OE-CONCEPT-oe-interdisciplinary-transmission, OE-CONCEPT-oe-interdisciplinary-scaffolding]

  - id: OE-CONCEPT-oe-interdisciplinary-communication
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Communication
    definitions:
      en:
        general: >
          The exchange of information between agents via signals,
          language, or other shared codes.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-information, OE-CONCEPT-oe-interdisciplinary-transmission]

  - id: OE-CONCEPT-oe-interdisciplinary-technology
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Technology
    definitions:
      en:
        general: >
          Tools, techniques, or systems created to extend or augment
          biological or cognitive capability.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-innovation, OE-CONCEPT-oe-interdisciplinary-niche-construction, OE-CONCEPT-oe-interdisciplinary-collective-intelligence, OE-SANDBOX-CONCEPT-oe-interdisciplinary-machine-culture]

  - id: OE-CONCEPT-oe-interdisciplinary-culture
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Culture
    definitions:
      en:
        general: >
          Socially transmitted knowledge, beliefs, practices, and
          artifacts shared within a group, persisting beyond any single
          individual.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-cooperation, OE-CONCEPT-oe-interdisciplinary-institutions, OE-CONCEPT-oe-interdisciplinary-norms, OE-SANDBOX-CONCEPT-oe-interdisciplinary-language-evolution, OE-SANDBOX-CONCEPT-oe-interdisciplinary-machine-culture]

  - id: OE-CONCEPT-oe-interdisciplinary-institutions
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Institutions
    definitions:
      en:
        general: >
          Stable, socially recognized structures or rules that organize
          and constrain collective behavior over time.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-culture, OE-CONCEPT-oe-interdisciplinary-norms, OE-CONCEPT-oe-interdisciplinary-cooperation]

  - id: OE-CONCEPT-oe-interdisciplinary-norms
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Norms
    definitions:
      en:
        general: >
          Shared expectations or rules of behavior within a group,
          enforced through social sanction rather than formal law.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-culture, OE-CONCEPT-oe-interdisciplinary-institutions, OE-CONCEPT-oe-interdisciplinary-information, OE-CONCEPT-oe-interdisciplinary-representation, OE-CONCEPT-oe-interdisciplinary-innovation]

  - id: OE-CONCEPT-oe-interdisciplinary-knowledge
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Knowledge
    definitions:
      en:
        general: >
          Justified, retained information that an individual, group, or
          system can draw upon to act or reason.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-information, OE-CONCEPT-oe-interdisciplinary-collective-intelligence, OE-CONCEPT-oe-interdisciplinary-distributed-cognition]

  - id: OE-CONCEPT-oe-interdisciplinary-collective-intelligence
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Collective Intelligence
    definitions:
      en:
        general: >
          Problem-solving or knowledge-generating capability that
          emerges from the coordinated activity of many individuals or
          agents, exceeding what any one could achieve alone.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-knowledge, OE-CONCEPT-oe-interdisciplinary-distributed-cognition, OE-CONCEPT-oe-interdisciplinary-technology]

  - id: OE-CONCEPT-oe-interdisciplinary-distributed-cognition
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Distributed Cognition
    definitions:
      en:
        general: >
          Cognitive processing that is spread across individuals,
          artifacts, and environment, rather than occurring solely
          within a single mind.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-knowledge, OE-CONCEPT-oe-interdisciplinary-collective-intelligence, OE-SANDBOX-CONCEPT-oe-interdisciplinary-metacognition]

  # ==========================================================================
  # SANDBOX TIER (RFC-0001, spec §4.5) — provisional, exempt from the
  # never-delete guarantee, TTL'd, not yet promoted through full RFC review.
  # Authored 2026-07-21 to ground OE-SANDBOX-LPM-interdisciplinary-k12-eva-capstone (MPI-EVA
  # cross-disciplinary capstone) and OE-SANDBOX-LPM-interdisciplinary-k12-machine-culture-coevolution (machine-culture
  # coevolution capstone) — see docs/design-notes/human-dimensions-k12-case-study.md
  # and RFC-0010.
  # ==========================================================================

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-language-evolution
    type: oe:Concept
    sandboxMeta:
      created: "2026-07-21"
      expiresOn: "2027-07-21"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Language Evolution
    definitions:
      en:
        general: >
          The process by which languages change, diversify, and
          descend from common ancestral languages over time, through
          the same general transmission-with-variation dynamics that
          shape other cultural traits.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-transmission, OE-CONCEPT-oe-interdisciplinary-culture, OE-CONCEPT-oe-interdisciplinary-innovation]
    examples:
      - Reconstructing a language family tree from shared and divergent
        features across related languages.
    citations:
      - text: >
          Reused from the same variation-selection-retention framework
          already cited on OE-CONCEPT-oe-interdisciplinary-selection (Mesoudi, A. (2011). Cultural
          Evolution: How Darwinian Theory Can Explain Human Culture and
          Synthesize the Social Sciences), applied here to language
          specifically rather than culture in general.

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-comparative-cognition
    type: oe:Concept
    sandboxMeta:
      created: "2026-07-21"
      expiresOn: "2027-07-21"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Comparative Cognition
    definitions:
      en:
        general: >
          The study of cognitive capacities (perception, memory,
          problem-solving, social learning) across species, used to
          identify which capacities are shared through common ancestry,
          which evolved independently, and which are distinctively
          elaborated in a given lineage.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-learning, OE-CONCEPT-oe-interdisciplinary-agency, OE-SANDBOX-CONCEPT-oe-interdisciplinary-theory-of-mind, OE-SANDBOX-CONCEPT-oe-interdisciplinary-intuitive-theories, OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning]
    examples:
      - Testing tool-use problem-solving in corvids, great apes, and
        young children to compare the cognitive strategies each group
        uses.

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-machine-culture
    type: oe:Concept
    sandboxMeta:
      created: "2026-07-21"
      expiresOn: "2027-07-21"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Machine Culture
    definitions:
      en:
        general: >
          Culture that is mediated or generated by machines — cases
          where AI systems shape, participate in, or themselves undergo
          the variation, transmission, and selection dynamics that
          define cultural evolution, rather than machines being only
          passive tools culture is transmitted through.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-culture, OE-CONCEPT-oe-interdisciplinary-selection, OE-CONCEPT-oe-interdisciplinary-technology, OE-SANDBOX-CONCEPT-oe-interdisciplinary-hybrid-social-learning]
    examples:
      - A recommendation algorithm's outputs shifting collective media
        consumption patterns, which in turn shifts what content gets
        produced and fed back into the algorithm's training data.
    citations:
      - text: >
          Brinkmann, L., Baumann, F., Bonnefon, J. F., Derex, M.,
          Müller, T. F., Nussberger, A. M., Czaplicka, A., Acerbi, A.,
          Griffiths, T. L., Henrich, J., Leibo, J. Z., McElreath, R.,
          Oudeyer, P. Y., Stray, J., & Rahwan, I. (2023). Machine
          culture. Nature Human Behaviour, 7(11), 1855-1868.
        doi: "10.1038/s41562-023-01742-2"

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-hybrid-social-learning
    type: oe:Concept
    sandboxMeta:
      created: "2026-07-21"
      expiresOn: "2027-07-21"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Hybrid Social Learning
    definitions:
      en:
        general: >
          Social learning processes that span human and artificial
          agents jointly — humans learning from AI-generated content
          or behavior, AI systems trained on human-generated content or
          behavior, and the resulting feedback loop between the two —
          rather than social learning occurring within a single-species
          population.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-learning, OE-SANDBOX-CONCEPT-oe-interdisciplinary-machine-culture]
    examples:
      - Students learning a problem-solving strategy partly from a
        human teacher and partly from an AI tutoring system, whose own
        responses were themselves shaped by prior learners' interactions.
    nonExamples:
      - A student learning solely from a textbook (no AI system's own
        behavior is being learned from or is adapting in response).

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-restructuration
    type: oe:Concept
    sandboxMeta:
      created: "2026-08-06"
      expiresOn: "2027-08-06"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Restructuration
    definitions:
      en:
        general: >
          A change in how a domain of knowledge is structured and
          understood, caused by a change in the representational
          infrastructure used to express it, rather than by new
          evidence within the old infrastructure — e.g. the shift from
          Roman to Hindu-Arabic numerals restructuring what arithmetic
          operations were tractable to learn. Distinguished from
          ordinary curriculum improvement (a better explanation of the
          same representation) by the claim that some understandings
          are not merely harder but effectively inaccessible until the
          representational infrastructure itself changes.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process, OE-SANDBOX-CONCEPT-oe-interdisciplinary-decentralized-causal-reasoning, OE-SANDBOX-CONCEPT-oe-interdisciplinary-agent-based-modeling]
    examples:
      - Agent-based/multi-agent computational models restructuring how
        emergent, decentralized phenomena (population-level natural
        selection, collective animal behavior, market dynamics) can be
        understood, by letting a learner author and run the low-level
        rules directly rather than only interpreting an aggregate
        equation.
    citations:
      - text: >
          Wilensky, U., & Papert, S. (2010). Restructurations:
          Reformulations of knowledge disciplines through new
          representational forms. Proceedings of the Constructionism
          2010 Conference.
      - text: >
          Goldstone, R. L., & Wilensky, U. (2008). Promoting transfer
          by grounding complex systems principles. Journal of the
          Learning Sciences, 17(4), 465-516.
        doi: "10.1080/10508400802394898"

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-decentralized-causal-reasoning
    type: oe:Concept
    sandboxMeta:
      created: "2026-08-06"
      expiresOn: "2027-08-06"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Decentralized Causal Reasoning
    definitions:
      en:
        general: >
          Explaining a system-level pattern as the aggregate result of
          many simultaneous, simple, local interactions among
          lower-level agents or elements, with no single controlling
          agent directing the outcome — contrasted with a "centralized
          mindset" that intuitively looks for a leader, designer, or
          single governing cause behind an observed pattern even when
          none exists.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-agency, OE-SANDBOX-CONCEPT-oe-interdisciplinary-restructuration, OE-SANDBOX-CONCEPT-oe-interdisciplinary-agent-based-modeling]
    examples:
      - Explaining a traffic jam, an ant colony's foraging pattern, or
        a bird flock's shape as emerging from many individuals
        following simple local rules, with no leader coordinating the
        group.
      - Explaining population-level natural selection as an aggregate
        statistical result of differential survival/reproduction among
        individual organisms, without invoking a designer or a
        population-level intention.
    nonExamples:
      - Attributing a flock's coordinated turn to a "leader bird"
        signaling the others.
    citations:
      - text: >
          Resnick, M. (1994). Turtles, Termites, and Traffic Jams:
          Explorations in Massively Parallel Microworlds. MIT Press.
      - text: >
          Resnick, M. (1996). Beyond the centralized mindset. Journal
          of the Learning Sciences, 5(1), 1-22.
        doi: "10.1207/S15327809JLS0501_1"
      - text: >
          Petrosino, A. J., Lucero, M. M., & Mann, M. J. (2015).
          Decentralized thinking and understanding of evolution in K-12
          evolution education. Evolution: Education and Outreach, 8(2).
        doi: "10.1186/s12052-014-0028-x"

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-agent-based-modeling
    type: oe:Concept
    sandboxMeta:
      created: "2026-08-06"
      expiresOn: "2027-08-06"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Agent-Based Modeling
    definitions:
      en:
        general: >
          A computational modeling method in which a system-level
          pattern is simulated by specifying rules for individual
          agents (e.g. organisms, particles, people) and their local
          interactions, then running the simulation forward and
          observing what pattern emerges — rather than specifying the
          system-level pattern directly as an equation.
        education: >
          As a pedagogical method: authoring or manipulating an
          agent-based model's low-level rules directly (e.g. in
          NetLogo), used as the representational infrastructure that
          makes decentralized causal reasoning learnable in practice,
          not just definable in principle.
    relations:
      skos:related: [OE-SANDBOX-CONCEPT-oe-interdisciplinary-restructuration, OE-SANDBOX-CONCEPT-oe-interdisciplinary-decentralized-causal-reasoning, OE-CONCEPT-oe-interdisciplinary-cooperation, OE-CONCEPT-oe-interdisciplinary-agency]
    examples:
      - A NetLogo model of predator-driven selection on a beetle
        population's running speed, where students set individual
        beetle/predator rules and observe the population-level
        selection pattern emerge across generations.
      - Two Foresters, a real classroom-ready NetLogo model (netlogo repo,
        openevo-ccs/netlogo) in which learners author/manipulate two
        foresters' individual harvest-rate rules directly and observe the
        aggregate sustainability/social-dilemma outcome emerge, rather
        than being told a resource-depletion equation -- a real
        cooperation-and-agency-domain instantiation of this concept, not
        a natural-selection one.
    citations:
      - text: >
          Wilensky, U. (2020). Restructuration theory and agent-based
          modeling: Reformulating knowledge domains through
          computational representations. In N. Holbert, M. Berland, &
          Y. Kafai (Eds.), Designing Constructionist Futures. MIT
          Press.
        doi: "10.7551/mitpress/12091.003.0037"

