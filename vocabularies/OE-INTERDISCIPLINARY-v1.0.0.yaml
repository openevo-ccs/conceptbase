        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-carrying-capacity
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Carrying Capacity
    definitions:
      en:
        general: 'the carrying capacity: this is the largest possible amount of resources that
          can be present on a patch / in a certain area.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-social-ecological-system-ses-framework
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-carrying-capacity
        principleClass: A
        definitionAuthorship: the unit's authors
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-logistic-growth
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Logistic Growth
    definitions:
      en:
        general: 'Most populations grow logistically, i.e. in the form of an S-shaped curve,
          because the more the population size approaches the carrying capacity, the slower
          the growth (because the competition within the population increases).

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-logistic-growth
        principleClass: A
        definitionAuthorship: the unit's authors
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-maximum-sustainable-yield
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Maximum Sustainable Yield
    definitions:
      en:
        general: 'The maximum sustainable yield of a resource is when the resource stock is
          at 50% of full carrying capacity.

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-maximum-sustainable-yield
        principleClass: A
        definitionAuthorship: the unit's authors
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-diminishing-returns
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Diminishing Returns
    definitions:
      en:
        general: 'Each extra unit of effort brings less extra gain than the one before it. Wording
          for students: The more you already take, the less each extra bit of work gets you.

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-diminishing-returns
        principleClass: A
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-efficiency
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Efficiency
    definitions:
      en:
        general: 'How much of a resource an agent gets from a given amount of effort or time.
          Wording for students: How much you collect for the work you put in.

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-efficiency
        principleClass: A
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-predator-prey-dynamics
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Predator-Prey Dynamics
    definitions:
      en:
        general: 'Linked rises and falls in two populations where one feeds on the other. The
          feeders grow when food is plentiful, then shrink after they eat too much of it, and
          the food recovers once there are fewer feeders. Wording for students: When there are
          many foresters and little forest, the foresters die back, then the forest grows again,
          and the cycle repeats.

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-predator-prey-dynamics
        principleClass: F
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-social-interaction
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Social Interaction
    definitions:
      en:
        general: 'In social interactions, the behavior of one individual has outcomes for others
          in the group.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-social-dilemma
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-social-interaction
        principleClass: B
        definitionAuthorship: the unit's authors
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-interdependence
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Interdependence
    definitions:
      en:
        general: 'A situation in which what happens to one party depends on what the others
          do. Wording for students: We are all in the same boat: if one of us does well or badly,
          the others feel it.

          '
    relations:
      skos:related:
      - OE-CONCEPT-oe-interdisciplinary-cooperation
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-interdependence
        principleClass: B
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-free-riding
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Free-Riding
    definitions:
      en:
        general: 'Enjoying the benefit of something shared without paying a fair share of its
          cost. Wording for students: Letting others do the work or hold back while you still
          get the benefit.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-social-dilemma
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-free-riding
        principleClass: B
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-collective-action
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Collective Action
    definitions:
      en:
        general: 'People acting together to reach a goal that needs many contributors, where
          each person could gain by letting others do the contributing. Wording for students:
          A goal we only reach if enough of us join in, even though it is tempting to hold back.

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-collective-action
        principleClass: B
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-fairness
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Fairness
    definitions:
      en:
        general: 'The sense that benefits and burdens are shared in a way people can accept.
          People mean different things by it: equal shares, shares by need, shares by contribution.
          Wording for students: Whether the way we split things or share the work feels right
          to everyone, though people may disagree on what "right" means.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-moral-foundations-theory
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-fairness
        principleClass: J
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-wicked-problems
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Wicked Problems
    definitions:
      en:
        general: 'Problems with no single clear definition or solution, where several goals
          pull against each other and every attempt to solve one changes the problem. Wording
          for students: Problems where people disagree about what the problem even is, and fixing
          one part can make another part worse.

          '
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-wicked-problems
        principleClass: I
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-fitness-interdependence
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Fitness Interdependence
    definitions:
      en:
        general: 'A situation in which the reproductive success of different individuals is
          tied together, so what helps one helps the others. Wording for students: When the
          survival of one depends on the survival of the others, helping them is also helping
          yourself.

          '
    relations:
      skos:related:
      - OE-CONCEPT-bio-core-fitness
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-fitness-interdependence
        principleClass: D
        definitionAuthorship: AI draft of 2026-11-06, awaiting review
        reviewLabel: Drafted with AI assistance, open for review.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-imitation-bias
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Imitation Bias
    definitions:
      en:
        general: 'A tendency to copy some models more than others, for example the majority,
          the minority, the most successful, the most experienced, or one''s parents. Wording
          for students: Who you copy decides which habits spread.

          '
    relations:
      skos:related:
