  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-complex-systems
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Complex Systems
    definitions:
      en:
        general: 'Systems made of many interacting parts whose joint behaviour cannot be read
          off from the parts alone and often involves feedback. Wording for students: A system
          where the pattern you see comes from many things affecting each other.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-decentralized-causal-reasoning
    extensions:
      oe:ecs.origin:
        source: ECS unit working copy, concept ECS-DRAFT-complex-systems
