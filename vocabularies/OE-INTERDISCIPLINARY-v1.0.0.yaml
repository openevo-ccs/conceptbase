  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-theory-of-mind
    type: oe:Concept
    sandboxMeta:
      created: "2026-08-01"
      expiresOn: "2027-08-01"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Theory of Mind
    definitions:
      en:
        general: >
          The capacity to attribute mental states — beliefs, desires,
          intentions, knowledge — to oneself and others, and to use
          those attributions to interpret and predict behavior.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-agency, OE-SANDBOX-CONCEPT-oe-interdisciplinary-comparative-cognition, OE-SANDBOX-CONCEPT-oe-interdisciplinary-metacognition, OE-SANDBOX-CONCEPT-oe-interdisciplinary-intuitive-theories]
    examples:
      - Inferring that a person will look for an object where they last
        saw it, even after it has been secretly moved, because they act
        on their own (now false) belief rather than the true state of
        the world.
    citations:
      - text: >
          Pillow, B. H., Lovett, S. B., & Hill, V. (2008). Children's,
          adolescents', and adults' reference to goals to explain
          interpersonal actions. Infant and Child Development, 17,
          471-489.
        doi: "10.1002/icd.560"

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-metacognition
    type: oe:Concept
    sandboxMeta:
      created: "2026-08-01"
      expiresOn: "2027-08-01"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Metacognition
    definitions:
      en:
        general: >
          The capacity to monitor, evaluate, and regulate one's own
          cognitive processes — knowing what one knows, tracking how
          one is thinking, and adjusting strategies accordingly.
    relations:
      skos:related: [OE-CONCEPT-oe-interdisciplinary-distributed-cognition, OE-SANDBOX-CONCEPT-oe-interdisciplinary-theory-of-mind, OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning]
    examples:
      - A student recognizing mid-exam that a chosen problem-solving
        strategy isn't working and deliberately switching to another one.
    citations:
      - text: >
          Pillow, B. H. (2012). Children's Discovery of the Active Mind:
          Phenomenological Awareness, Social Experience, and Knowledge
          about Cognition. Springer.
        doi: "10.1007/978-1-4614-2248-8"
      - text: >
          Pillow, B. H. (2008). Development of Children's Understanding
          of Cognitive Activities. The Journal of Genetic Psychology,
          169(4), 297-321.
        doi: "10.3200/GNTP.169.4.297-321"
      - text: >
          Pillow, B. H., & Pearson, R. M. (2015). Children's and adults'
          judgments of the controllability of cognitive activities.
          Metacognition and Learning.
        doi: "10.1007/s11409-014-9122-2"
      - text: >
          Zdybel, D. (2021). Children's conceptions of memory and
          imagination -- from conceptual knowledge to metacognition.
          Phenomenographical study. Thinking Skills and Creativity, 41.
        doi: "10.1016/j.tsc.2021.100855"

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-intuitive-theories
    type: oe:Concept
    sandboxMeta:
      created: "2026-08-01"
      expiresOn: "2027-08-01"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Intuitive Theories
    definitions:
      en:
        general: >
          Informal, domain-specific causal frameworks — folk physics,
          folk biology, folk psychology — that people spontaneously
          construct to explain and predict how the world works,
          typically without formal instruction.
    relations:
      skos:related: [OE-SANDBOX-CONCEPT-oe-interdisciplinary-comparative-cognition, OE-SANDBOX-CONCEPT-oe-interdisciplinary-theory-of-mind, OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning]
    examples:
      - A young child's untaught assumption that living things grow
        from the inside on their own, while artifacts only change when
        acted on from the outside — an intuitive "folk biology" causal
        rule, not one explicitly taught.

  # --------------------------------------------------------------------------
  # Authored 2026-09-02 to ground a new interdisciplinary-k12 strand
  # (OE-STRAND-oe-interdisciplinary-k12-analogy-search-metacognition) weaving analogy, local search, and metacognitive
  # development across biological/cultural evolution, cognitive science, and
  # the history of science. No existing concept in this vocabulary named the
  # analogy-as-search-and-transmission-mechanism idea itself (confirmed via
  # conceptbase_search before authoring); Metacognition/Theory of Mind/
  # Intuitive Theories/Comparative Cognition already existed above and are
  # reused, not duplicated.
  # --------------------------------------------------------------------------

  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-analogical-reasoning
    type: oe:Concept
    sandboxMeta:
      created: "2026-09-02"
      expiresOn: "2027-09-02"
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Analogical Reasoning
    definitions:
      en:
        general: >
          Generating or evaluating a new idea by mapping the structure of an
          already-familiar case onto an unfamiliar one — starting a search
          for a solution from whichever known example is most similar to the
          target, rather than starting from nothing, and checking which
          parts of the familiar case do and do not carry over.
    relations:
      skos:broader: [OE-CONCEPT-oe-interdisciplinary-evolutionary-process]
      skos:related:
        - OE-CONCEPT-oe-interdisciplinary-selection
        - OE-CONCEPT-oe-interdisciplinary-variation
        - OE-CONCEPT-oe-interdisciplinary-innovation
        - OE-SANDBOX-CONCEPT-oe-interdisciplinary-metacognition
        - OE-SANDBOX-CONCEPT-oe-interdisciplinary-comparative-cognition
        - OE-SANDBOX-CONCEPT-oe-interdisciplinary-intuitive-theories
    examples:
      - A student solving a new math problem by first asking "what problem
        I already know is most similar to this one?" and adapting that
        solution.
      - Darwin using breeders' deliberate selection of livestock as the
        starting structure for imagining selection happening in nature
        without a breeder.
    nonExamples:
      - Noticing two things merely look alike without mapping which parts
        of their structure correspond (see Restructuration's own
        representation-vs-analogy distinction).
    citations:
      - text: >
          Brand, C. O., Mesoudi, A., & Smaldino, P. E. (2021). Analogy as a
          Catalyst for Cumulative Cultural Evolution. Trends in Cognitive
          Sciences, 25(6), 450-461.
        doi: "10.1016/j.tics.2021.03.002"
      - text: >
          Holding, T., Smaldino, P. E., & Brand, C. O. (2026). Analogies
          evolve by increasing transmission fidelity in the communication
          of complex information. Evolutionary Human Sciences, 1-26.
        doi: "10.1017/ehs.2026.10063"
      - text: >
          Bramley, N. R., Zhao, B., Quillien, T., & Lucas, C. G. (2023).
          Local search and the evolution of world models. Topics in
          Cognitive Science.
        doi: "10.1111/tops.12703"
      - text: >
          Hofstadter, D. R., & Sander, E. (2013). Surfaces and Essences:
          Analogy as the Fuel and Fire of Thinking. Basic Books.
  - id: OE-SANDBOX-CONCEPT-oe-interdisciplinary-common-pool-resource
    type: oe:Concept
    sandboxMeta:
      created: '2026-11-25'
      expiresOn: '2027-11-25'
      status: active
    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Common-Pool Resource
    definitions:
      en:
        general: 'Commons or common-pool resources (CPRs) are resources that can be used by
          all members in a community, and which are limited - if someone uses part of the resource
          in the community, there is less for the others.

          '
    relations:
      skos:related:
      - OE-SANDBOX-CONCEPT-oe-interdisciplinary-tragedy-of-the-commons
    extensions:
