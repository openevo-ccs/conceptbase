    version: 0.1.0
    definedInVocabulary: OE-INTERDISCIPLINARY-v1.0.0
    labels:
      en: Chance in a model
    definitions:
      en:
        general: 'Random events in a model make runs with identical settings come out differently,
          so one run is not enough. The tendencies across many runs stay.

          '
    relations:
