# ============================================================================
# OpenEvo ConceptBase — Controlled Vocabulary: BIO-CORE
# ============================================================================
# Path: /vocabularies/BIO-CORE-v1.0.0.yaml
#
# Discipline-specific vocabulary for biological evolution, structured
# around the traditional gene/organism/population framing (see Spec v0.2,
# "Traditional Biology Vocabulary"). Each entry under `concepts:` validates
# against /schemas/concept.schema.yaml.
#
# This vocabulary is intentionally single-discipline in most entries —
# contrast with OE-INTERDISCIPLINARY-v1.0.0, which reframes several of
# these same ideas (e.g. Inheritance, Selection) as one instance among
# several inheritance/selection systems. Cross-vocabulary alignment
# between the two (e.g. BIO-CORE:Natural_Selection <-> 
# OE-INTERDISCIPLINARY:Selection) is deliberately deferred to
# /alignments/ (Phase 2), not asserted here.
# ============================================================================

meta:
  id: BIO-CORE
  version: 1.0.0
  status: stable
  scope: >
    Core biological evolution vocabulary, discipline-specific framing
    (organism / population / gene-centered).
  discipline: biology
  license: CC-BY-NC-SA-4.0
  authors:
    - name: OpenEvo ConceptBase Maintainers
  conformsTo: OE-SCHEMA-CONCEPT-v1.0.0
  phase: 1

concepts:

  - id: OE-CONCEPT-000101
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Evolution
    definitions:
      en:
        biology: >
          Change in the heritable characteristics of biological
          populations across successive generations.
    relations:
      skos:narrower: [OE-CONCEPT-000102, OE-CONCEPT-000110, OE-CONCEPT-000111, OE-CONCEPT-000116]
      # OE-CONCEPT-000308/309/310/313/314/315 (Scale, Feedback, Deep Time and
      # Scale, Human Place in Nature, Origins of Science, Machine-Culture
      # Coevolution -- EVA4K12-CONCEPTS) added per RFC-0012's migration
      # script, reciprocating that vocabulary's skos:related assertions
      # (scripts/check_related_symmetry.py requires symmetry).
      skos:related: [OE-CONCEPT-000112, OE-CONCEPT-000113, OE-CONCEPT-000308, OE-CONCEPT-000309, OE-CONCEPT-000310, OE-CONCEPT-000313, OE-CONCEPT-000314, OE-CONCEPT-000315]
    extensions:
      "oe:eva4k12DevelopmentalArc":
        source: EVA4K12-CONCEPTS-v1.0.0 (RFC-0012), migrated from the eva4k12 repository (archived)
        sourceURI: "https://eva4k12.openevo.net/concepts/eva/evolution"
        note: >
          Additive K-12 developmental-arc content from eva4k12, not a
          redefinition of this entry's `definitions.biology` above.
        arc:
          K-2:
            cognitiveModeLabel: Things change over time
            studentFacingDescription: >
              Living things change over very, very long times — the animals
              alive today are different from the animals that lived long ago.
            classroomInstantiation: >
              Comparing dinosaurs to birds and noticing similarities
              suggesting relationship; placing extinct and living animals on
              a simple timeline showing change over time; noticing that
              great-grandparents' tools, stories, and homes were different
              from our own — things changed.
            educatorBridgingNote: >
              At K–2, evolution is introduced as the simple observable fact
              that living things change over time. Do not introduce
              mechanism at this level; do not use the word 'evolution'
              unless students are ready for it. The goal is temporal
              openness — students should not assume today's plants and
              animals have always been this way. Respect the
              evolution-and-worldview sensitive-topic protocol: present as
              'what scientists observe,' not as a worldview claim.
          3-5:
            cognitiveModeLabel: Organisms changed through selection
            studentFacingDescription: >
              Living things change over many generations because some
              individuals survive and reproduce better than others — and
              their children inherit what made them successful.
            classroomInstantiation: >
              Running the natural selection bead simulation and observing
              allele frequency change; reading the pocket mouse case study
              as an example of evolution in action; connecting the hominin
              timeline to the idea that each species adapted to its
              environment over many generations.
            educatorBridgingNote: >
              At 3–5, the mechanism of natural selection is introduced
              explicitly: variation exists, it is heritable, and some
              variants survive/reproduce better. At this level, evolution =
              biological change through natural selection. Cultural
              evolution can be introduced as an analogy, keeping the
              biological and cultural cases clearly distinct.
          6-8:
            cognitiveModeLabel: "Mechanisms: selection, drift, mutation, migration"
            studentFacingDescription: >
              Evolution happens through multiple mechanisms, not just
              natural selection. Drift, mutation, and migration also change
              allele frequencies — and not all evolutionary change is
              adaptive.
            classroomInstantiation: >
              Comparing the effects of selection vs. drift in small vs.
              large populations; understanding the founder effect as an
              example of drift producing non-adaptive evolution; connecting
              language evolution to biological evolution.
            educatorBridgingNote: >
              At 6–8, evolution becomes mechanistically plural. A key
              conceptual move: distinguishing adaptive from non-adaptive
              evolution — only selection consistently produces adaptation.
          9-12:
            cognitiveModeLabel: Multi-level, multi-system evolutionary theory
            studentFacingDescription: >
              Evolution operates at multiple levels simultaneously — genes,
              organisms, groups, species, and cultural traditions can all be
              subject to selection. Gene-culture coevolution couples
              biological and cultural evolutionary dynamics.
            classroomInstantiation: >
              Evaluating multi-level selection theory as an explanation for
              human ultrasociality; modeling gene-culture coevolution at the
              LCT locus; analyzing machine-culture coevolution as a new
              evolutionary dynamic.
            educatorBridgingNote: >
              At 9–12, evolution is a theoretical object — a research
              program with ongoing debates about levels of selection, the
              extended evolutionary synthesis, and the scope of cultural
              evolutionary theory. The CCT.MACH-CULT connection (see
              OE-CONCEPT-000315) is genuinely contested, not settled.

  - id: OE-CONCEPT-000102
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Natural Selection
    definitions:
      en:
        biology: >
          Differential reproductive success among heritable variants
          within a population, resulting from their interaction with
          the environment.
    relations:
      skos:broader: [OE-CONCEPT-000101]
      skos:related: [OE-CONCEPT-000104, OE-CONCEPT-000105, OE-CONCEPT-000115, OE-CONCEPT-000103]
    examples:
      - Peppered moth coloration shifting with industrial soot levels.
      - Antibiotic resistance increasing in bacterial populations under drug exposure.
    nonExamples:
      - An individual organism changing behavior within its own lifetime (not heritable).
      - A population's gene frequencies changing due to a random sampling event (see Drift).
    citations:
      - text: "Darwin, C. (1859). On the Origin of Species."

  - id: OE-CONCEPT-000103
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Mutation
    definitions:
      en:
        biology: >
          A heritable change in a DNA sequence, serving as an ultimate
          source of genetic variation within a population.
    relations:
      skos:related: [OE-CONCEPT-000106, OE-CONCEPT-000107, OE-CONCEPT-000102, OE-SANDBOX-CONCEPT-000002]

  - id: OE-CONCEPT-000104
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Adaptation
    definitions:
      en:
        biology: >
          A heritable trait that increases an organism's fitness within
          a given environment, shaped by natural selection over
          generations.
    relations:
      # OE-CONCEPT-000301/311/313 (Structure, Variation and Universals, Human
      # Place in Nature -- EVA4K12-CONCEPTS) reciprocate that vocabulary's
      # skos:related assertions, per RFC-0012.
      skos:related: [OE-CONCEPT-000102, OE-CONCEPT-000105, OE-CONCEPT-000301, OE-CONCEPT-000311, OE-CONCEPT-000313]
    extensions:
      "oe:eva4k12DevelopmentalArc":
        source: EVA4K12-CONCEPTS-v1.0.0 (RFC-0012), migrated from the eva4k12 repository (archived)
        sourceURI: "https://eva4k12.openevo.net/concepts/eva/adaptation"
        note: >
          Additive K-12 developmental-arc content from eva4k12, not a
          redefinition of this entry's `definitions.biology` above.
        arc:
          K-2:
            cognitiveModeLabel: Survival features
            studentFacingDescription: >
              Animals and plants have features that help them survive in
              their home — different places need different features.
            classroomInstantiation: >
              Polar bears have thick fur for cold places; desert animals can
              go a long time without water; humans in cold climates
              historically wore many layers of clothing.
            educatorBridgingNote: >
              At K–2, adaptation is 'features that help' — functional and
              concrete. Do not introduce natural selection yet. Critically,
              do NOT frame adaptation as intentional; use passive
              constructions ('polar bears that had thicker fur were better
              able to survive').
          3-5:
            cognitiveModeLabel: Trait advantage — first explicit name
            studentFacingDescription: >
              Some traits help organisms survive and reproduce better than
              others. Over many generations, those helpful traits become
              more common — that process is called natural selection.
            classroomInstantiation: >
              Natural selection simulation with beads; comparing beak shapes
              in Darwin's finches to available food types; explaining why
              dark coloring is common in pocket mice on dark lava rock.
            educatorBridgingNote: >
              At 3–5, 'adaptation' is named explicitly for the first time.
              Flag the intentionality misconception immediately. Cultural
              adaptations (tools, farming practices) can be introduced here
              as spreading by learning rather than by genes.
          6-8:
            cognitiveModeLabel: Population-level selection
            studentFacingDescription: >
              Adaptation happens at the population level — the change in how
              common a trait is across a population over generations.
            classroomInstantiation: >
              Tracking allele frequency change across simulated generations;
              comparing cultural adaptation rates (fast) to genetic
              adaptation rates (slow).
            educatorBridgingNote: >
              Distinguish adaptation (the process) from an adaptation (a
              trait that resulted from selection). Cultural adaptations
              spread faster than genetic ones because they spread by
              learning.
          9-12:
            cognitiveModeLabel: Formal evolutionary mechanisms
            studentFacingDescription: >
              Adaptation is one of several evolutionary mechanisms —
              selection, drift, mutation, and migration all shape trait
              frequencies. Only selection produces adaptation.
            classroomInstantiation: >
              Separating adaptive evolution (selection) from non-adaptive
              evolution (drift, mutation); evaluating competing adaptive
              hypotheses for human life history evolution.
            educatorBridgingNote: >
              Students should ask: 'What is the evidence this trait was
              shaped by selection rather than drift?' — the empirical
              questions of adaptationism.

  - id: OE-CONCEPT-000105
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Fitness
    definitions:
      en:
        biology: >
          The relative reproductive success of a genotype or phenotype,
          typically measured as expected number of offspring
          contributing to the next generation.
    relations:
      skos:related: [OE-CONCEPT-000102, OE-CONCEPT-000104, OE-CONCEPT-000115]
    examples:
      - A beak shape enabling more efficient seed cracking during drought.
    nonExamples:
      - Physical strength or health in a general, non-reproductive sense.

  - id: OE-CONCEPT-000106
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Gene
    definitions:
      en:
        biology: >
          A heritable unit of DNA that functions as a basic unit of
          inheritance, typically encoding information for a specific
          product or trait.
    relations:
      skos:narrower: [OE-CONCEPT-000107]
      skos:related: [OE-CONCEPT-000103, OE-CONCEPT-000112]

  - id: OE-CONCEPT-000107
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Allele
    definitions:
      en:
        biology: >
          One of two or more alternative forms of a gene occupying the
          same locus on a chromosome.
    relations:
      skos:broader: [OE-CONCEPT-000106]
      skos:related: [OE-CONCEPT-000103, OE-CONCEPT-000111]

  - id: OE-CONCEPT-000108
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Population
    definitions:
      en:
        biology: >
          A group of interbreeding organisms of the same species
          occupying a defined geographic area at a given time.
    relations:
      skos:related: [OE-CONCEPT-000109, OE-CONCEPT-000111]

  - id: OE-CONCEPT-000109
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Species
    definitions:
      en:
        biology: >
          A group of organisms capable of interbreeding and producing
          fertile offspring, generally reproductively isolated from
          other such groups.
    relations:
      skos:related: [OE-CONCEPT-000110, OE-CONCEPT-000114, OE-CONCEPT-000108, OE-CONCEPT-000116, OE-SANDBOX-CONCEPT-000001]

  - id: OE-CONCEPT-000110
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Speciation
    definitions:
      en:
        biology: >
          The evolutionary process by which populations diverge to
          become distinct, reproductively isolated species.
    relations:
      skos:broader: [OE-CONCEPT-000101]
      skos:related: [OE-CONCEPT-000109, OE-CONCEPT-000111]

  - id: OE-CONCEPT-000111
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Drift
    definitions:
      en:
        biology: >
          Random fluctuation of allele frequencies within a population
          from one generation to the next, independent of selective
          advantage.
    relations:
      skos:broader: [OE-CONCEPT-000101]
      skos:related: [OE-CONCEPT-000108, OE-CONCEPT-000107, OE-CONCEPT-000110]

  - id: OE-CONCEPT-000112
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Inheritance
    definitions:
      en:
        biology: >
          The transmission of genetic information from parent to
          offspring.
    relations:
      skos:related: [OE-CONCEPT-000106, OE-CONCEPT-000101]

  - id: OE-CONCEPT-000113
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Phylogeny
    definitions:
      en:
        biology: >
          The evolutionary history and relatedness of a group of
          organisms, typically represented as a branching tree.
    relations:
      skos:related: [OE-CONCEPT-000114, OE-CONCEPT-000101, OE-SANDBOX-CONCEPT-000001]

  - id: OE-CONCEPT-000114
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Common Ancestor
    definitions:
      en:
        biology: >
          An organism or population from which two or more descendant
          lineages have diverged.
    relations:
      skos:related: [OE-CONCEPT-000113, OE-CONCEPT-000109, OE-SANDBOX-CONCEPT-000001]

  - id: OE-CONCEPT-000115
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Selection Pressure
    definitions:
      en:
        biology: >
          An environmental or biological factor that reduces or
          increases reproductive success of particular variants within
          a population, driving the direction of selection.
    relations:
      skos:related: [OE-CONCEPT-000102, OE-CONCEPT-000105]

  - id: OE-CONCEPT-000116
    type: oe:Concept
    status: stable
    version: 1.0.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Extinction
    definitions:
      en:
        biology: >
          The complete disappearance of a species or other taxonomic
          group, ending its lineage.
    relations:
      skos:broader: [OE-CONCEPT-000101]
      skos:related: [OE-CONCEPT-000109]

  # ==========================================================================
  # SANDBOX TIER (RFC-0001, spec §4.5) — provisional, exempt from the
  # never-delete guarantee, TTL'd, not yet promoted through full RFC review.
  # Authored 2026-07-21 to ground OE-SANDBOX-LPM-000001/000002 (bio-core-k12
  # sandbox forks on human evolutionary genetics and paleoanthropology,
  # strictly decentralized-causal framing, no agency vocabulary — see
  # docs/design-notes/human-dimensions-k12-case-study.md and RFC-0010).
  # ==========================================================================

  - id: OE-SANDBOX-CONCEPT-000001
    type: oe:Concept
    sandboxMeta:
      created: "2026-07-21"
      expiresOn: "2027-07-21"
      status: active
    version: 0.1.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Hominin
    definitions:
      en:
        biology: >
          A member of the taxonomic group (tribe Hominini) comprising
          modern humans, extinct human species, and their immediate
          fossil ancestors since the divergence from the lineage leading
          to chimpanzees — a strictly taxonomic/phylogenetic category,
          not an agency- or intentionality-bearing one.
    relations:
      skos:related: [OE-CONCEPT-000114, OE-CONCEPT-000113, OE-CONCEPT-000109, OE-SANDBOX-CONCEPT-000002]
    examples:
      - Homo sapiens, Homo neanderthalensis, and Australopithecus afarensis
        are all hominins.
    nonExamples:
      - Chimpanzees and other non-human great apes are close relatives but
        not hominins under the tribe-level definition used here.

  - id: OE-SANDBOX-CONCEPT-000002
    type: oe:Concept
    sandboxMeta:
      created: "2026-07-21"
      expiresOn: "2027-07-21"
      status: active
    version: 0.1.0
    definedInVocabulary: BIO-CORE-v1.0.0
    labels:
      en: Ancient DNA
    definitions:
      en:
        biology: >
          Genetic material recovered and sequenced from historical or
          fossil remains, enabling direct observation of genetic
          variation and population history at past points in time rather
          than inferring it solely from present-day populations.
    relations:
      skos:related: [OE-CONCEPT-000103, OE-SANDBOX-CONCEPT-000001]
    examples:
      - Sequencing DNA extracted from a Neanderthal fossil to compare it
        directly against present-day human genomes.
    nonExamples:
      - Inferring past population size changes purely from patterns of
        variation in living populations, with no ancient sample sequenced
        (a legitimate but different method — population genetics, not
        ancient DNA analysis specifically).