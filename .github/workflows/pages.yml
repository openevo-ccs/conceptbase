name: Deploy ConceptBase registry to GitHub Pages

# Serves the generated registry/ (concept/competency/alignment JSON, the
# lpm/strand index files, and registry/resolve.html) at
# https://openevo-ccs.github.io/conceptbase/registry/ -- this is live
# redirect infrastructure for the registered www.w3id.org/openevo/
# namespace (see w3id.org/openevo/.htaccess's lpm/strand/concept/
# competency/alignment rules), not a demo app. The interactive
# ConceptBase Explorer that used to live in app/ and be deployed to the
# site root was retired; nothing under this Pages site is meant to be
# browsed by a human directly anymore.

on:
  push:
    branches: [main]
    paths: ["registry/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble site (registry/ only)
        run: |
          mkdir -p _site/registry
          cp -r registry/. _site/registry/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
