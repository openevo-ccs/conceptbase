  - id: OE-FRAMEWORK-RELATION-000015
    subject: "kmk-basiskonzepte-biologie:bk_steuerung_regelung"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: controls
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Hormonelle Regelkreise steuern ontogenetische Prozesse (Pubertät,
      Menstruationszyklus, Metamorphose).

  - id: OE-FRAMEWORK-RELATION-000016
    subject: "kmk-basiskonzepte-biologie:bk_steuerung_regelung"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Regelkreise selbst sind evolvierte Kontrollarchitekturen mit
      historischem Gepäck: suboptimale Sollwerte, verzögerte
      Rückkopplungsschleifen und mehrere parallele, teils redundante
      Regelmechanismen (z. B. verschiedene Wege der
      Blutzuckerregulation) sind nur erklärbar, wenn man Steuerung und
      Regelung als Ergebnis schrittweiser Selektion auf bereits
      bestehenden physiologischen Systemen begreift, nicht als
      optimales technisches Design. Added 2026-08-22, same
      coherence-gap closure as OE-FRAMEWORK-RELATION-000008.

