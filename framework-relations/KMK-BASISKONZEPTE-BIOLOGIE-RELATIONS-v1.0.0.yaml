    status: proposed
    rationale: >
      Biologische Regelkreise sind durch Informations- und
      Kommunikationsprozesse realisiert (Hormone, Nervenimpulse als
      Signalträger der Rückkopplung).

  - id: OE-FRAMEWORK-RELATION-000014
    subject: "kmk-basiskonzepte-biologie:bk_steuerung_regelung"
