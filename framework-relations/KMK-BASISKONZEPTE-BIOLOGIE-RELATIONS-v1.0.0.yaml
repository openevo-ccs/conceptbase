#
# Seed content for RFC-0018 (frameworkRelation.schema.yaml). Each entry
# validates against that schema. Source: EvoMentor_DE's
# data/basiskonzepte.json `bk_verbindungen` arrays (v4.1, 2026-08-22),
# transcribed here as the first real instance data for this schema --
# not hypothetical examples. tagIds are carried through unchanged from
# that source (bk_struktur_funktion, bk_stoff_energie_umwandlung,
# bk_information_kommunikation, bk_steuerung_regelung,
# bk_individuelle_evolutive_entwicklung), all under frameworkId
# "kmk-basiskonzepte-biologie".
#
# This set is the first concrete, checkable evidence for KoMet's own
# subtitle -- "Kohärenz durch Meta-Modellierung von Curricula" -- and
# for its Domain B/D Computational Curriculum Competencies (Curriculum
# Coherence / Curricular Meta-Modeling): it makes explicit, as typed
# queryable data rather than prose, that every one of the five KMK
# Basiskonzepte only fully makes sense in light of evolution (the
# isExplainedBy / explainsOriginOf pairs below) -- previously true only
# for bk_struktur_funktion, closed for the remaining three as of
# EvoMentor_DE basiskonzepte.json v4.1.
#
# One asymmetry preserved deliberately from the source: `requires` has
# no declared inverse (see frameworkRelation.schema.yaml relationType
# description), so bk_stoff_energie_umwandlung "requires"
# bk_struktur_funktion has no separate reverse record here, matching
# the source data's own asymmetric assertion.
# ============================================================================

meta:
  id: KMK-BASISKONZEPTE-BIOLOGIE-RELATIONS
  version: 1.0.0
  status: proposed
  scope: >
    Typed causal/structural relations among the five KMK Basiskonzepte
    Biologie, sourced from EvoMentor_DE's Thuringia Gymnasium
    didactic dataset.
  license: CC-BY-NC-SA-4.0
  authors:
    - name: OpenEvo ConceptBase Maintainers
  conformsTo: OE-SCHEMA-FRAMEWORK-RELATION-v1.0.0
  sourceDataset: EvoMentor_DE/data/basiskonzepte.json v4.1 (2026-08-22)
  phase: 1

relations:

  # --- bk_struktur_funktion -------------------------------------------------
  - id: OE-FRAMEWORK-RELATION-000001
    subject: "kmk-basiskonzepte-biologie:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie:bk_stoff_energie_umwandlung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Strukturen (z. B. Alveolen, Darmzotten, Mitochondrien) ermöglichen
      spezifische Stoff- und Energieumwandlungsprozesse. Ohne Struktur
      keine Funktion im Stoffwechsel.

  - id: OE-FRAMEWORK-RELATION-000002
    subject: "kmk-basiskonzepte-biologie:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie:bk_information_kommunikation"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Die Struktur von Nervenzellen, Sinnesorganen und Rezeptormolekülen
      ist die notwendige Bedingung für Informationsaufnahme,
      -weiterleitung und -verarbeitung.

  - id: OE-FRAMEWORK-RELATION-000003
    subject: "kmk-basiskonzepte-biologie:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Strukturelle Angepasstheiten sind das Ergebnis evolutiver
      Selektion. Ind/Evo liefert die historisch-kausale Erklärung für
      das Vorhandensein bestimmter Strukturen.

  - id: OE-FRAMEWORK-RELATION-000004
    subject: "kmk-basiskonzepte-biologie:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie:bk_steuerung_regelung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Regelkreise setzen strukturelle Komponenten voraus: Sensoren
      (Sinnesorgane, Chemorezeptoren), Effektoren (Drüsen, Muskeln) und
      Leitungswege (Nerven, Blutgefäße).

  # --- bk_stoff_energie_umwandlung ------------------------------------------
  - id: OE-FRAMEWORK-RELATION-000005
    subject: "kmk-basiskonzepte-biologie:bk_stoff_energie_umwandlung"
    object: "kmk-basiskonzepte-biologie:bk_struktur_funktion"
    relationType: requires
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Stoff- und Energieumwandlungsprozesse setzen spezifische
      Strukturen voraus (Alveolenbau für Gasaustausch, Darmzotten für
      Resorption, Mitochondrien für Zellatmung).

  - id: OE-FRAMEWORK-RELATION-000006
    subject: "kmk-basiskonzepte-biologie:bk_stoff_energie_umwandlung"
    object: "kmk-basiskonzepte-biologie:bk_steuerung_regelung"
    relationType: isRegulatedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Metabolische Zustandsgrößen (Blutzucker, CO2-Konzentration,
      Osmolalität) werden durch Regelkreise konstant gehalten.

  - id: OE-FRAMEWORK-RELATION-000007
    subject: "kmk-basiskonzepte-biologie:bk_stoff_energie_umwandlung"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Stoffwechselprozesse liefern die Energie für Wachstum, Zellteilung
      und Differenzierung in der Ontogenese.

  - id: OE-FRAMEWORK-RELATION-000008
    subject: "kmk-basiskonzepte-biologie:bk_stoff_energie_umwandlung"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Stoffwechselwege selbst sind keine optimal konstruierten Systeme,
      sondern das Ergebnis evolutiver Bastelei (evolutionary tinkering)
      auf bereits vorhandenen biochemischen Grundlagen: der umständliche
      Umweg der Glykolyse, die Mehrfachnutzung derselben Enzymfamilien
      in unterschiedlichen Stoffwechselwegen und Kompromisslösungen wie
      die Sauerstoffabhängigkeit der Zellatmung sind nur als
      historisch-kontingente Produkte natürlicher Selektion
      verständlich, nicht als von Grund auf geplantes Design. Added
      2026-08-22 to close the coherence gap identified in EvoMentor_DE
      basiskonzepte.json v4.1 -- previously only bk_struktur_funktion
      carried this relation type.

  # --- bk_information_kommunikation -----------------------------------------
  - id: OE-FRAMEWORK-RELATION-000009
    subject: "kmk-basiskonzepte-biologie:bk_information_kommunikation"
    object: "kmk-basiskonzepte-biologie:bk_steuerung_regelung"
    relationType: implements
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Informations- und Kommunikationsprozesse sind der Mechanismus,
      durch den biologische Regelkreise realisiert werden.

  - id: OE-FRAMEWORK-RELATION-000010
    subject: "kmk-basiskonzepte-biologie:bk_information_kommunikation"
    object: "kmk-basiskonzepte-biologie:bk_struktur_funktion"
    relationType: requires
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Nervenzellstruktur, Synapsenaufbau, Rezeptorstruktur und
      Sinnesorganarchitektur sind strukturelle Grundlagen aller
      Informationsprozesse.

  - id: OE-FRAMEWORK-RELATION-000011
    subject: "kmk-basiskonzepte-biologie:bk_information_kommunikation"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Das Hormonsystem (Info/Komm) steuert die individuelle Entwicklung
      (Pubertät, Menstruationszyklus, Metamorphose); Informationsprozesse
      sind die kausalen Mechanismen der Ontogenese.

  - id: OE-FRAMEWORK-RELATION-000012
    subject: "kmk-basiskonzepte-biologie:bk_information_kommunikation"
    object: "kmk-basiskonzepte-biologie:bk_individuelle_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v4.1]
    date: "2026-08-22"
    status: proposed
    rationale: >
      Die Architektur biologischer Informations- und
      Kommunikationssysteme ist selbst ein evolutives Produkt: die
      Wiederverwendung uralter Hormonrezeptor-Familien für immer neue
      Signalfunktionen und redundante parallele Kommunikationskanäle
      (Nerven, Hormone, Immunsystem) sind nur als schrittweise
      Modifikation bereits vorhandener evolutionärer Strukturen
      erklärbar, nicht als kohärent geplantes Kommunikationssystem.
      Added 2026-08-22, same coherence-gap closure as
      OE-FRAMEWORK-RELATION-000008.

