      Osmolalität) werden durch Regelkreise konstant gehalten

  - id: OE-FRAMEWORK-RELATION-000007
    subject: "kmk-basiskonzepte-biologie-2024:bk_stoff_energie_umwandlung"
    object: "kmk-basiskonzepte-biologie-2024:bk_individuelle_entwicklung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Stoffwechselprozesse liefern die Energie für Wachstum, Zellteilung
      und Differenzierung in der Ontogenese

  - id: OE-FRAMEWORK-RELATION-000008
    subject: "kmk-basiskonzepte-biologie-2024:bk_stoff_energie_umwandlung"
    object: "kmk-basiskonzepte-biologie-2024:bk_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Stoffwechselwege selbst sind keine optimal konstruierten Systeme,
      sondern das Ergebnis evolutiver Bastelei (evolutionary tinkering)
      auf bereits vorhandenen biochemischen Grundlagen: Der umständliche
      Umweg der Glykolyse, die Mehrfachnutzung derselben Enzymfamilien
      in unterschiedlichen Stoffwechselwegen und Kompromisslösungen wie
      die Sauerstoffabhängigkeit der Zellatmung sind nur als historisch-
      kontingente Produkte natürlicher Selektion verständlich, nicht als
      von Grund auf geplantes Design

