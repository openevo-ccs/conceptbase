    date: "2026-08-23"
    status: proposed
    rationale: >
      Das Hormonsystem (Info/Komm) steuert die individuelle Entwicklung
      (Pubertät, Menstruationszyklus, Metamorphose);
      Informationsprozesse sind die kausalen Mechanismen der Ontogenese.

  - id: OE-FRAMEWORK-RELATION-000012
    subject: "kmk-basiskonzepte-biologie-2024:bk_information_kommunikation"
    object: "kmk-basiskonzepte-biologie-2024:bk_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Die Architektur biologischer Informations- und
      Kommunikationssysteme ist selbst ein evolutives Produkt: die
      Wiederverwendung uralter Hormonrezeptor-Familien für immer neue
      Signalfunktionen, redundante parallele Kommunikationskanäle
      (Nerven, Hormone, Immunsystem) und suboptimal 'verdrahtete'
      Sinnes- und Nervenbahnen sind nur als schrittweise Modifikation
      bereits vorhandener evolutionärer Strukturen erklärbar, nicht als
      kohärent geplantes Kommunikationssystem

