relations:
  # --- bk_struktur_funktion --------------------------------------------------
  - id: OE-FRAMEWORK-RELATION-000001
    subject: "kmk-basiskonzepte-biologie-2024:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie-2024:bk_stoff_energie_umwandlung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Strukturen (z. B. Alveolen, Darmzotten, Mitochondrien) ermöglichen
      spezifische Stoff- und Energieumwandlungsprozesse. Ohne Struktur
      keine Funktion im Stoffwechsel.

  - id: OE-FRAMEWORK-RELATION-000002
    subject: "kmk-basiskonzepte-biologie-2024:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie-2024:bk_information_kommunikation"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Die Struktur von Nervenzellen, Sinnesorganen und Rezeptormolekülen
      ist die notwendige Bedingung für Informationsaufnahme,
      -weiterleitung und -verarbeitung.

  - id: OE-FRAMEWORK-RELATION-000003
    subject: "kmk-basiskonzepte-biologie-2024:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie-2024:bk_evolutive_entwicklung"
    relationType: isExplainedBy
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Strukturelle Angepasstheiten sind das Ergebnis evolutiver
      Selektion. Die evolutive Entwicklung liefert die historisch-
      kausale Erklärung für das Vorhandensein bestimmter Strukturen.

  - id: OE-FRAMEWORK-RELATION-000004
    subject: "kmk-basiskonzepte-biologie-2024:bk_struktur_funktion"
    object: "kmk-basiskonzepte-biologie-2024:bk_steuerung_regelung"
    relationType: enables
    assertedBy: [EvoMentor_DE basiskonzepte.json v5.0]
    date: "2026-08-23"
    status: proposed
    rationale: >
      Regelkreise setzen strukturelle Komponenten voraus: Sensoren
      (Sinnesorgane, Chemorezeptoren), Effektoren (Drüsen, Muskeln) und
      Leitungswege (Nerven, Blutgefäße).

